<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>美装職人！クリーンマスター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#061323;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow-x:hidden}
body{padding:12px 10px 30px}
button{font:inherit}
h1{text-align:center;font-size:clamp(25px,7vw,40px);line-height:1.1;margin:5px 0 6px;font-weight:900}
.sub{text-align:center;color:#dce8f7;font-weight:800;font-size:clamp(14px,4vw,20px);margin-bottom:14px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:920px;margin:auto}
.box{background:#162f52;border:1px solid #274b76;border-radius:17px;text-align:center;padding:10px 3px;box-shadow:0 5px 14px #0003}
.num{font-size:clamp(23px,7vw,38px);font-weight:900;line-height:1.05}
.label{font-size:12px;color:#dce8f7;margin-top:4px;font-weight:800}
.game{position:relative;max-width:920px;height:min(720px,68vh);min-height:500px;margin:14px auto 0;border:6px solid #3e628b;border-radius:38px;overflow:hidden;touch-action:manipulation;box-shadow:inset 0 0 35px #0003}
.stageName{position:absolute;left:22px;top:17px;z-index:8;font-size:clamp(20px,5vw,34px);font-weight:900;color:#5c7387;opacity:.75;pointer-events:none;text-shadow:0 1px #fff6}
.decor{position:absolute;inset:0;z-index:1;pointer-events:none}

.dirt{position:absolute;z-index:10;border:0;padding:0;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 6px 5px #0004);transition:transform .08s,opacity .12s}
.dirt:active{transform:scale(.82)}
.dirt.dust{width:64px;height:45px;border-radius:50%;background:#694024}
.dirt.grease{width:68px;height:48px;border-radius:50%;background:#c89108;box-shadow:inset 0 0 0 5px #8d6500}
.dirt.mold{width:70px;height:48px;border-radius:50%;background:#4d9b46;box-shadow:inset 0 0 0 5px #286a32}
.dirt.water{width:64px;height:64px;border-radius:50%;background:#57b9e8;box-shadow:inset 0 0 0 5px #2384b5}
.dirt.scale{width:70px;height:48px;border-radius:50%;background:#e9eef2;box-shadow:inset 0 0 0 4px #aeb9c2}
.dirt.hard{width:82px;height:58px;border-radius:48%;background:#542a1d;outline:5px solid #ff7149}
.dirt::after{content:"";position:absolute;inset:11px 19px;background:#a16d4b;border-radius:50%;opacity:.7}
.dirt.grease::after{background:#ffe36c}
.dirt.mold::after{background:#8dd66f}
.dirt.water::after{background:#bcefff}
.dirt.scale::after{background:#fff}
.dirt.hard::after{background:#873b2d}

.float{position:absolute;z-index:30;font-weight:900;font-size:28px;color:#ffe16a;pointer-events:none;animation:float .65s ease-out forwards;text-shadow:0 2px 4px #0008}
@keyframes float{
0%{opacity:1;transform:translateY(0) scale(1)}
100%{opacity:0;transform:translateY(-65px) scale(1.15)}
}
.flash{position:absolute;inset:0;z-index:40;pointer-events:none;animation:flash .25s ease-out}
@keyframes flash{
0%{background:#f33a3a55}
100%{background:transparent}
}

/* ===== 5種類の部屋 ===== */

.kitchen{
background:linear-gradient(135deg,#fff0c5 0 43%,#d8b476 43% 100%)
}
.kitchen .decor:before{
content:"🍳   🧂   🫙";
position:absolute;
right:18px;
top:16px;
font-size:34px;
filter:drop-shadow(0 3px 2px #0002)
}
.kitchen .decor:after{
content:"▰  ▰  ▰  ▰";
position:absolute;
left:0;
right:0;
bottom:0;
height:85px;
background:#8b5b37;
color:#e5bf94;
text-align:center;
padding-top:20px;
font-size:26px
}

.bath{
background:linear-gradient(180deg,#b9edff 0 60%,#e7f8fb 60% 100%)
}
.bath .decor:before{
content:"🛁";
position:absolute;
right:22px;
bottom:40px;
font-size:145px;
opacity:.72
}
.bath .decor:after{
content:"🚿      🪞";
position:absolute;
left:18px;
top:18px;
font-size:42px
}

.aircon{
background:linear-gradient(180deg,#dff4ff 0 56%,#aebfd0 56% 100%)
}
.aircon .decor:before{
content:"❄️";
position:absolute;
right:25px;
top:22px;
font-size:80px;
opacity:.45
}
.aircon .decor:after{
content:"🪑        🪴        📺";
position:absolute;
left:18px;
right:18px;
bottom:28px;
font-size:55px;
display:flex;
justify-content:space-between
}

.room{
background:linear-gradient(135deg,#e6d8c9 0 50%,#92755d 50% 100%)
}
.room .decor:before{
content:"🛋️";
position:absolute;
left:25px;
bottom:45px;
font-size:125px;
opacity:.9
}
.room .decor:after{
content:"📺     🪴     🖼️";
position:absolute;
right:18px;
top:18px;
font-size:42px
}

.pro{
background:linear-gradient(135deg,#eef3f8 0 48%,#aebdcd 48% 100%)
}
.pro .decor:before{
content:"🧹   🪣   🧽   🧴";
position:absolute;
left:18px;
right:18px;
bottom:28px;
font-size:45px;
display:flex;
justify-content:space-around;
opacity:.9
}
.pro .decor:after{
content:"✨ PROFESSIONAL CLEANING ✨";
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:25px;
font-weight:900;
color:#fff8;
text-align:center;
white-space:nowrap
}

/* スタート画面 */

#startScreen{
position:fixed;
inset:0;
z-index:1000;
background:linear-gradient(160deg,#061323,#102d50);
display:flex;
align-items:center;
justify-content:center;
padding:24px
}
.startCard{
width:min(620px,94vw);
background:#19385d;
border:5px solid #4773a0;
border-radius:34px;
padding:30px 22px;
text-align:center;
box-shadow:0 20px 60px #0008
}
.startLogo{font-size:70px;line-height:1;margin-bottom:12px}
.startCard h2{font-size:clamp(27px,8vw,44px);margin:0 0 10px}
.startCard p{color:#dce8f7;font-weight:800;line-height:1.7;margin:8px 0 16px}
.mainBtn{
border:0;
border-radius:20px;
padding:17px 42px;
background:#4fe09d;
color:#062318;
font-size:24px;
font-weight:900;
box-shadow:0 8px 0 #239c69;
cursor:pointer
}
.mainBtn:active{
transform:translateY(5px);
box-shadow:0 3px 0 #239c69
}

/* 結果 */

#result{
max-width:800px;
margin:24px auto 0;
background:#19385d;
border:5px solid #4773a0;
border-radius:34px;
padding:28px 18px;
text-align:center;
display:none
}
#result h2{
font-size:clamp(30px,8vw,44px);
margin:5px 0 10px
}
.finalScore{
font-size:clamp(52px,15vw,82px);
font-weight:900;
color:#ffc247;
line-height:1
}
.rankBox{
background:#071a31;
border-radius:24px;
padding:18px;
margin:20px 0;
text-align:left
}
.rankTitle{
text-align:center;
font-size:25px;
font-weight:900;
margin-bottom:12px
}
.rankRow{
display:flex;
justify-content:space-between;
gap:8px;
padding:10px 5px;
border-bottom:1px solid #294361;
font-weight:900
}
.rankRow:last-child{border-bottom:0}
.rankMe{color:#ffd34e}

#again{
width:min(92%,520px);
border:0;
border-radius:20px;
padding:17px;
background:#4fe09d;
color:#062318;
font-size:23px;
font-weight:900;
cursor:pointer
}

#message{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:50;
background:#061323dd;
padding:14px 22px;
border-radius:16px;
font-size:24px;
font-weight:900;
display:none;
pointer-events:none;
white-space:nowrap
}

@media(max-width:600px){
body{padding:8px 8px 24px}
.game{height:67vh;min-height:520px;border-radius:32px}
.dirt.dust{width:54px;height:38px}
.dirt.grease{width:58px;height:40px}
.dirt.mold{width:58px;height:40px}
.dirt.water{width:54px;height:54px}
.dirt.scale{width:58px;height:40px}
.dirt.hard{width:68px;height:48px}
.pro .decor:after{font-size:17px}
.rankRow{font-size:15px}
}
</style>
</head>

<body>

<div id="startScreen">
<div class="startCard">
<div class="startLogo">🧹🐉🐶</div>
<h2>美装職人！<br>クリーンマスター</h2>
<p>
5つの部屋を順番に掃除しよう！<br>
汚れを素早くタップして高得点を狙え🔥<br>
コンボをつなぐほど得点アップ！
</p>
<button id="startBtn" class="mainBtn">▶ ゲームスタート</button>
</div>
</div>

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">
<div class="box">
<div class="num" id="stage">1</div>
<div class="label">ステージ</div>
</div>

<div class="box">
<div class="num" id="time">30</div>
<div class="label">残り時間</div>
</div>

<div class="box">
<div class="num" id="score">0</div>
<div class="label">スコア</div>
</div>

<div class="box">
<div class="num" id="combo">0</div>
<div class="label">コンボ</div>
</div>
</div>

<div id="game" class="game kitchen">

<div id="stageName" class="stageName">
🍳 KITCHEN
</div>

<div class="decor"></div>

<div id="message"></div>

</div>

<div id="result">

<div style="font-size:62px">🏆</div>

<h2>ゲーム終了！</h2>

<div style="font-weight:800">
あなたのスコア
</div>

<div id="finalScore" class="finalScore">
0点
</div>

<div class="rankBox">

<div class="rankTitle">
🏆 あなたのランキング
</div>

<div id="ranking"></div>

</div>

<button id="again">
もう一度！
</button>

</div>

<script>
"use strict";

const STAGES=[
{
name:"🍳 KITCHEN",
cls:"kitchen",
time:28,
count:9,
types:["dust","grease","hard"]
},
{
name:"🛁 BATH",
cls:"bath",
time:27,
count:10,
types:["dust","water","scale","hard"]
},
{
name:"❄️ AIR CONDITIONER",
cls:"aircon",
time:26,
count:12,
types:["dust","water","mold","hard"]
},
{
name:"🛋️ ROOM",
cls:"room",
time:25,
count:14,
types:["dust","mold","hard"]
},
{
name:"✨ PROFESSIONAL",
cls:"pro",
time:32,
count:17,
types:["dust","grease","mold","water","scale","hard"]
}
];

const POINTS={
dust:120,
grease:220,
mold:260,
water:180,
scale:300,
hard:500
};

let stageIndex=0;
let score=0;
let combo=0;
let timeLeft=0;
let playing=false;
let timerId=null;
let spawnId=null;
let dirtId=0;
let transitionLock=false;

const $=id=>document.getElementById(id);

const game=$("game");
const stageEl=$("stage");
const timeEl=$("time");
const scoreEl=$("score");
const comboEl=$("combo");
const stageName=$("stageName");
const result=$("result");
const finalScore=$("finalScore");
const ranking=$("ranking");
const message=$("message");
const startScreen=$("startScreen");

function updateHUD(){

stageEl.textContent=stageIndex+1;

timeEl.textContent=timeLeft;

scoreEl.textContent=
Math.max(0,score).toLocaleString();

comboEl.textContent=combo;

}

function clearDirt(){

game.querySelectorAll(".dirt")
.forEach(d=>d.remove());

}

function clearTimers(){

clearInterval(timerId);
clearInterval(spawnId);

timerId=null;
spawnId=null;

}

function rand(a,b){

return a+Math.random()*(b-a);

}

function pick(arr){

return arr[Math.floor(Math.random()*arr.length)];

}

function createDirt(){

const s=STAGES[stageIndex];

if(
!playing ||
game.querySelectorAll(".dirt").length>=s.count
)return;

const type=pick(s.types);

const d=document.createElement("button");

d.className="dirt "+type;

d.dataset.points=POINTS[type];

d.dataset.id=++dirtId;

d.setAttribute(
"aria-label",
"汚れを掃除"
);

let x=rand(5,86);
let y=rand(9,86);

d.style.left=x+"%";
d.style.top=y+"%";

d.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
e.stopPropagation();
cleanDirt(d);
},
{passive:false}
);

game.appendChild(d);

}

function cleanDirt(d){

if(!playing || !d.isConnected)
return;

const pts=Number(d.dataset.points);

const rect=d.getBoundingClientRect();

const gRect=game.getBoundingClientRect();

d.remove();

combo++;

const bonus=
1+
Math.min(combo-1,15)*0.08;

const gained=
Math.round(pts*bonus);

score+=gained;

showFloat(
"+"+gained,
rect.left-gRect.left,
rect.top-gRect.top
);

updateHUD();

if(
game.querySelectorAll(".dirt").length===0
){

setTimeout(
nextStage,
280
);

}

}

function wrongTap(){

if(!playing)
return;

combo=0;

score=
Math.max(0,score-80);

updateHUD();

showFloat(
"−80",
game.clientWidth/2-25,
game.clientHeight/2
);

const f=
document.createElement("div");

f.className="flash";

game.appendChild(f);

setTimeout(
()=>f.remove(),
260
);

}

game.addEventListener(
"pointerdown",
e=>{

if(
e.target===game ||
e.target===stageName ||
e.target===game.querySelector(".decor")
){

wrongTap();

}

}
);

function showFloat(text,x,y){

const f=
document.createElement("div");

f.className="float";

f.textContent=text;

f.style.left=x+"px";
f.style.top=y+"px";

game.appendChild(f);

setTimeout(
()=>f.remove(),
700
);

}

function startStage(){

transitionLock=false;

clearTimers();

clearDirt();

const s=STAGES[stageIndex];

game.className=
"game "+s.cls;

stageName.textContent=
s.name;

timeLeft=s.time;

combo=0;

updateHUD();

const initial=
Math.min(
Math.max(5,Math.floor(s.count*.55)),
s.count
);

for(
let i=0;
i<initial;
i++
){

createDirt();

}

game.dataset.stage=
stageIndex;

timerId=
setInterval(
()=>{

if(!playing)
return;

timeLeft--;

updateHUD();

if(timeLeft<=0){

if(
stageIndex<
STAGES.length-1
){

nextStage();

}else{

endGame();

}

}

},
1000
);

spawnId=
setInterval(
()=>{

if(!playing)
return;

if(
game.querySelectorAll(".dirt").length<
s.count
){

createDirt();

}

},
700
);

}

function nextStage(){

if(
!playing ||
transitionLock
)
return;

transitionLock=true;

if(
stageIndex>=
STAGES.length-1
){

endGame();

return;

}

message.textContent=
"✨ STAGE CLEAR!";

message.style.display=
"block";

setTimeout(
()=>{

message.style.display=
"none";

stageIndex++;

startStage();

},
500
);

}

function saveRank(){

const key=
"cleanMasterRanking";

let list=[];

try{

list=
JSON.parse(
localStorage.getItem(key)||"[]"
);

}catch(e){

list=[];

}

list.push({

name:"リュウタ",

score:score,

date:
new Date()
.toLocaleDateString("ja-JP")

});

list.sort(
(a,b)=>b.score-a.score
);

list=
list.slice(0,5);

try{

localStorage.setItem(
key,
JSON.stringify(list)
);

}catch(e){}

return list;

}

function renderRank(list){

ranking.innerHTML=
list.map(
(r,i)=>`

<div class="rankRow ${
r.name==="リュウタ" &&
r.score===score
?"rankMe":""
}">

<span>
${["🥇","🥈","🥉","4️⃣","5️⃣"][i]}
${r.name}
</span>

<span>
${Number(r.score).toLocaleString()}点
</span>

</div>

`
).join("");

}

function endGame(){

if(!playing)
return;

playing=false;

clearTimers();

clearDirt();

finalScore.textContent=
score.toLocaleString()+"点";

renderRank(
saveRank()
);

result.style.display=
"block";

setTimeout(
()=>result.scrollIntoView({
behavior:"smooth",
block:"center"
}),
80
);

}

function resetGame(){

clearTimers();

stageIndex=0;

score=0;

combo=0;

playing=true;

result.style.display=
"none";

startScreen.style.display=
"none";

updateHUD();

startStage();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

$("startBtn")
.addEventListener(
"click",
resetGame
);

$("again")
.addEventListener(
"click",
resetGame
);

updateHUD();

</script>

</body>
</html>
