<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>美装職人！クリーンマスター</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
background:#071222;
color:white;
overflow-x:hidden;
}

body{
padding:15px 12px 30px;
}

h1{
text-align:center;
font-size:clamp(24px,7vw,40px);
margin:5px 0;
font-weight:900;
}

.sub{
text-align:center;
font-size:clamp(14px,4vw,21px);
font-weight:800;
color:#dbe5f5;
margin-bottom:15px;
}

.hud{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
max-width:900px;
margin:auto;
}

.box{
background:#162d4e;
border-radius:18px;
padding:12px 4px;
text-align:center;
}

.num{
font-size:clamp(23px,7vw,38px);
font-weight:900;
line-height:1;
}

.label{
font-size:13px;
margin-top:6px;
color:#dbe5f5;
}

/* ゲーム画面 */

.game{
position:relative;
height:min(720px,68vh);
min-height:500px;
max-width:900px;
margin:16px auto;
border:6px solid #3e6085;
border-radius:40px;
overflow:hidden;
touch-action:manipulation;
}

/* ステージ背景 */

.kitchen{
background:
linear-gradient(135deg,#fff1c8 0 48%,#d8b27a 48%);
}

.bath{
background:
linear-gradient(135deg,#e7faff,#83c7db);
}

.aircon{
background:
linear-gradient(180deg,#dff4ff 0 55%,#b4cfe2 55%);
}

.room{
background:
linear-gradient(135deg,#d9cbbb 0 50%,#8d7660 50%);
}

.pro{
background:
linear-gradient(135deg,#eef3f8 0 50%,#aebdce 50%);
}

.stageName{
position:absolute;
top:18px;
left:22px;
font-size:clamp(20px,5vw,34px);
font-weight:900;
opacity:.3;
pointer-events:none;
}

/* 汚れ */

.dirt{
position:absolute;
border:0;
z-index:5;
cursor:pointer;
filter:drop-shadow(0 6px 6px #0005);
}

.small{
width:52px;
height:36px;
border-radius:50%;
background:#684020;
}

.medium{
width:70px;
height:47px;
border-radius:50%;
background:#70421f;
}

.hard{
width:78px;
height:53px;
border-radius:50%;
background:#55291d;
outline:5px solid #ff7045;
}

.gold{
width:72px;
height:50px;
border-radius:50%;
background:#ffd34e;
outline:4px solid #fff1a0;
}

.dirt:after{
content:"";
position:absolute;
left:20%;
top:20%;
width:55%;
height:40%;
border-radius:50%;
background:#98704f;
opacity:.7;
}

.hard:after{
background:#80382b;
}

.gold:after{
background:#fff19b;
}

/* +100 / -100 */

.float{
position:absolute;
z-index:20;
font-size:28px;
font-weight:900;
pointer-events:none;
animation:up .7s forwards;
}

@keyframes up{
0%{
opacity:1;
transform:translateY(0);
}
100%{
opacity:0;
transform:translateY(-60px);
}
}

/* 間違いタップ */

.flash{
position:absolute;
inset:0;
z-index:30;
background:#ff333355;
animation:flash .25s forwards;
pointer-events:none;
}

@keyframes flash{
to{
background:transparent;
}
}

/* 結果 */

#result{
display:none;
max-width:750px;
margin:30px auto;
padding:30px 20px;
background:#19345a;
border:5px solid #3e6085;
border-radius:35px;
text-align:center;
}

#result h2{
font-size:38px;
margin:10px 0;
}

.final{
font-size:60px;
font-weight:900;
color:#ffc247;
}

button{
border:0;
border-radius:18px;
padding:16px 35px;
font-size:20px;
font-weight:900;
background:#4fe09d;
color:#062318;
margin-top:20px;
}
</style>
</head>

<body>

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">

<div class="box">
<div class="num" id="stage">1</div>
<div class="label">ステージ</div>
</div>

<div class="box">
<div class="num" id="time">30</div>
<div class="label">残り時間</div>
</div>

<div class="box">
<div class="num" id="score">0</div>
<div class="label">スコア</div>
</div>

<div class="box">
<div class="num" id="combo">0</div>
<div class="label">コンボ</div>
</div>

</div>

<div id="game" class="game kitchen">

<div id="stageName" class="stageName">
🔍 KITCHEN
</div>

</div>

<div id="result">

<div style="font-size:60px">🏆</div>

<h2>ゲーム終了！</h2>

<div>あなたのスコア</div>

<div id="finalScore" class="final">
0点
</div>

<button onclick="location.reload()">
もう一度！
</button>

</div>

<script>

/* =========================
   ステージ設定
========================= */

const stages=[

{
name:"🔍 KITCHEN",
className:"kitchen",
time:30,
maxDirt:8
},

{
name:"🛁 BATH",
className:"bath",
time:30,
maxDirt:11
},

{
name:"❄️ AIR CONDITIONER",
className:"aircon",
time:30,
maxDirt:14
},

{
name:"🛋️ ROOM",
className:"room",
time:30,
maxDirt:17
},

{
name:"✨ PROFESSIONAL",
className:"pro",
time:35,
maxDirt:20
}

];


/* =========================
   ゲーム変数
========================= */

let stage=0;
let score=0;
let combo=0;
let time=30;
let playing=true;
let timer;


/* =========================
   HTML取得
========================= */

const game=document.getElementById("game");

const stageEl=document.getElementById("stage");

const timeEl=document.getElementById("time");

const scoreEl=document.getElementById("score");

const comboEl=document.getElementById("combo");

const stageName=document.getElementById("stageName");


/* =========================
   HUD更新
========================= */

function hud(){

stageEl.textContent=stage+1;

timeEl.textContent=time;

scoreEl.textContent=Math.max(0,score).toLocaleString();

comboEl.textContent=combo;

}


/* =========================
   汚れを全部消す
========================= */

function clearDirt(){

document.querySelectorAll(".dirt").forEach(d=>{
d.remove();
});

}


/* =========================
   汚れタイプ
========================= */

function makeDirt(){

if(!playing)return;


/*
ステージが進むほど
硬い汚れが増える
*/

const difficulty=stage;

const r=Math.random();

let type;

let points;


/* 金色レア */

if(r<0.08){

type="gold";

points=1500;

}


/* HARD */

else if(r<0.25 + difficulty*0.03){

type="hard";

points=350;

}


/* MEDIUM */

else if(r<0.60){

type="medium";

points=200;

}


/* SMALL */

else{

type="small";

points=100;

}


/* 汚れ作成 */

const d=document.createElement("button");

d.className="dirt "+type;

d.dataset.points=points;


/*
ゲーム画面の中に
ランダム配置
*/

d.style.left=(5+Math.random()*85)+"%";

d.style.top=(8+Math.random()*84)+"%";


/* タップ */

d.onclick=function(e){

e.stopPropagation();

if(!playing)return;


/* 得点 */

const p=Number(d.dataset.points);


/* 消す */

d.remove();


/* コンボ */

combo++;


/* コンボボーナス */

const bonus=
1+Math.min(combo-1,20)*0.05;


/* 加点 */

const add=Math.round(p*bonus);

score+=add;


/* 表示 */

floatText("+"+add);


/* HUD */

hud();


/*
ここ重要！

全部消しても
ステージは変わらない。

時間が0になるまで
同じステージ。
*/

};


/* ゲーム画面へ追加 */

game.appendChild(d);

}


/* =========================
   +点 / -点表示
========================= */

function floatText(text){

const f=document.createElement("div");

f.className="float";

f.textContent=text;

f.style.left="45%";

f.style.top="45%";

game.appendChild(f);

setTimeout(()=>{
f.remove();
},700);

}


/* =========================
   間違いタップ
========================= */

function wrongTap(){

if(!playing)return;


/*
スコアは0にならない。
100点だけ減る。
*/

score-=100;

if(score<0){
score=0;
}


/*
コンボリセット
*/

combo=0;


/* 表示 */

floatText("−100");


/* 赤フラッシュ */

const flash=document.createElement("div");

flash.className="flash";

game.appendChild(flash);

setTimeout(()=>{
flash.remove();
},250);


/* HUD */

hud();

}


/* =========================
   ゲーム画面タップ
========================= */

game.onclick=function(e){

/*
汚れ以外を押したら
−100点
*/

if(
e.target===game ||
e.target===stageName
){

wrongTap();

}

};


/* =========================
   ステージ開始
========================= */

function startStage(){

const s=stages[stage];


/* 画面クリア */

clearDirt();


/* 背景変更 */

game.className="game "+s.className;


/* ステージ名 */

stageName.textContent=s.name;


/* 時間 */

time=s.time;


/* コンボ */

combo=0;


/* HUD */

hud();


/*
最初の汚れ

ステージが進むほど
最初から多くする
*/

for(
let i=0;
i<s.maxDirt;
i++
){

makeDirt();

}


/* タイマー */

clearInterval(timer);

timer=setInterval(function(){

if(!playing)return;


/* 1秒減る */

time--;


/* HUD */

hud();


/*
時間切れ
*/

if(time<=0){

nextStage();

}

},1000);

}


/* =========================
   次ステージ
========================= */

function nextStage(){

if(!playing)return;


/*
まだステージがある
*/

if(stage<stages.length-1){

stage++;

startStage();

return;

}


/*
5ステージ終了
*/

endGame();

}


/* =========================
   ゲーム終了
========================= */

function endGame(){

playing=false;

clearInterval(timer);

clearDirt();

document.getElementById("finalScore").textContent=
score.toLocaleString()+"点";

document.getElementById("result").style.display="block";

}


/* =========================
   汚れ補充
========================= */


/*
ここも重要。

汚れを消しても
すぐ新しい汚れが出る。

ただし最大数以上にはならない。
*/

setInterval(function(){

if(!playing)return;

const max=stages[stage].maxDirt;

const current=
document.querySelectorAll(".dirt").length;


/*
減った分だけ補充
*/

if(current<max){

makeDirt();

}

},500);


/* =========================
   開いた瞬間にスタート
========================= */

startStage();

</script>

</body>
</html>
