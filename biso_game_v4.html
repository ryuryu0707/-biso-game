<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>美装職人！クリーンマスター</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
background:#071222;
color:white;
overflow-x:hidden;
}

body{
padding:12px 10px 30px;
}

h1{
text-align:center;
font-size:clamp(25px,7vw,42px);
margin:5px 0 2px;
font-weight:900;
}

.sub{
text-align:center;
font-size:clamp(14px,4vw,21px);
font-weight:800;
color:#dbe5f5;
margin-bottom:14px;
}

.hud{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
max-width:900px;
margin:auto;
}

.box{
background:#162d4e;
border-radius:18px;
padding:11px 3px;
text-align:center;
}

.num{
font-size:clamp(22px,7vw,38px);
font-weight:900;
line-height:1;
}

.label{
font-size:12px;
margin-top:6px;
color:#dbe5f5;
}

/* =========================
ゲームエリア
========================= */

.game{
position:relative;
height:min(720px,68vh);
min-height:500px;
max-width:900px;
margin:15px auto;
border:6px solid #3e6085;
border-radius:35px;
overflow:hidden;
touch-action:manipulation;
}

/* =========================
ステージ背景
========================= */

.kitchen{
background:
linear-gradient(135deg,#fff0c7 0 45%,#d6ae76 45% 100%);
}

.bath{
background:
linear-gradient(135deg,#dff8ff 0 45%,#79bfd4 45% 100%);
}

.aircon{
background:
linear-gradient(180deg,#eaf8ff 0 50%,#b9cfdf 50%);
}

.room{
background:
linear-gradient(135deg,#eee1d2 0 48%,#a7896f 48%);
}

.pro{
background:
linear-gradient(135deg,#f5f7fa 0 42%,#9aaabc 42%);
}

.stageName{
position:absolute;
top:15px;
left:20px;
font-size:clamp(20px,5vw,34px);
font-weight:900;
opacity:.35;
pointer-events:none;
z-index:2;
}

/* =========================
汚れ共通
========================= */

.dirt{
position:absolute;
z-index:10;
border:0;
cursor:pointer;
filter:drop-shadow(0 5px 5px #0005);
padding:0;
}

/* ホコリ */

.dust{
width:45px;
height:30px;
border-radius:50%;
background:#6b6258;
}

.dust:after{
content:"";
position:absolute;
width:55%;
height:40%;
left:22%;
top:20%;
border-radius:50%;
background:#9c9185;
}

/* 油汚れ */

.oil{
width:72px;
height:45px;
border-radius:50%;
background:#594225;
outline:4px solid #8b6b35;
}

.oil:after{
content:"";
position:absolute;
width:50%;
height:35%;
left:25%;
top:25%;
border-radius:50%;
background:#b39452;
}

/* カビ */

.mold{
width:55px;
height:55px;
border-radius:50%;
background:#285d38;
outline:4px solid #6da84d;
}

.mold:after{
content:"";
position:absolute;
width:35%;
height:35%;
left:32%;
top:30%;
border-radius:50%;
background:#173b28;
}

/* 水アカ */

.water{
width:62px;
height:42px;
border-radius:50%;
background:#52798b;
outline:4px solid #9bdcf5;
}

.water:after{
content:"";
position:absolute;
width:50%;
height:40%;
left:25%;
top:25%;
border-radius:50%;
background:#7695a3;
}

/* 焦げ */

.burn{
width:78px;
height:52px;
border-radius:50%;
background:#4c2118;
outline:5px solid #ff7045;
}

.burn:after{
content:"";
position:absolute;
width:50%;
height:40%;
left:25%;
top:25%;
border-radius:50%;
background:#7e3327;
}

/* 金色レア */

.gold{
width:75px;
height:52px;
border-radius:50%;
background:#ffd34e;
outline:5px solid #fff0a0;
}

.gold:after{
content:"";
position:absolute;
width:50%;
height:40%;
left:25%;
top:25%;
border-radius:50%;
background:#fff3a8;
}

/* =========================
得点表示
========================= */

.float{
position:absolute;
z-index:30;
font-size:30px;
font-weight:900;
pointer-events:none;
animation:up .7s forwards;
}

@keyframes up{
0%{
opacity:1;
transform:translateY(0) scale(1);
}
100%{
opacity:0;
transform:translateY(-65px) scale(1.2);
}
}

.good{
color:#42f59b;
}

.bad{
color:#ff6464;
}

/* =========================
ミス演出
========================= */

.flash{
position:absolute;
inset:0;
z-index:25;
background:#ff222244;
animation:flash .3s forwards;
pointer-events:none;
}

@keyframes flash{
to{
background:transparent;
}
}

/* =========================
結果画面
========================= */

#result{
display:none;
max-width:750px;
margin:25px auto;
padding:30px 20px;
background:#19345a;
border:5px solid #3e6085;
border-radius:35px;
text-align:center;
}

#result h2{
font-size:38px;
margin:10px 0;
}

.final{
font-size:58px;
font-weight:900;
color:#ffc247;
margin:15px 0 25px;
}

button{
border:0;
border-radius:18px;
padding:16px 35px;
font-size:20px;
font-weight:900;
background:#4fe09d;
color:#062318;
margin-top:10px;
}

</style>
</head>

<body>

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">

<div class="box">
<div class="num" id="stage">1</div>
<div class="label">ステージ</div>
</div>

<div class="box">
<div class="num" id="time">30</div>
<div class="label">残り時間</div>
</div>

<div class="box">
<div class="num" id="score">0</div>
<div class="label">スコア</div>
</div>

<div class="box">
<div class="num" id="combo">0</div>
<div class="label">コンボ</div>
</div>

</div>


<div id="game" class="game kitchen">

<div id="stageName" class="stageName">
🍳 KITCHEN
</div>

</div>


<div id="result">

<div style="font-size:65px">🏆</div>

<h2>ゲーム終了！</h2>

<div>あなたのスコア</div>

<div id="finalScore" class="final">
0点
</div>

<button onclick="location.reload()">
もう一度！
</button>

</div>


<script>

/* ==================================================
ステージ設定
================================================== */

const stages = [

/* ステージ1 */

{
name:"🍳 KITCHEN",
className:"kitchen",
time:30,
maxDirt:7,
types:["oil","burn","dust"]
},

/* ステージ2 */

{
name:"🛁 BATH",
className:"bath",
time:30,
maxDirt:9,
types:["mold","water","dust"]
},

/* ステージ3 */

{
name:"❄️ AIR CONDITIONER",
className:"aircon",
time:30,
maxDirt:11,
types:["dust","dust","water","gold"]
},

/* ステージ4 */

{
name:"🛋️ ROOM",
className:"room",
time:30,
maxDirt:13,
types:["dust","dust","oil","burn"]
},

/* ステージ5 */

{
name:"✨ PROFESSIONAL",
className:"pro",
time:35,
maxDirt:16,
types:["burn","mold","oil","gold"]
}

];


/* ==================================================
ゲーム変数
================================================== */

let stage = 0;

let score = 0;

let combo = 0;

let time = 30;

let playing = true;

let timer = null;

let refillTimer = null;


/* ==================================================
HTML
================================================== */

const game =
document.getElementById("game");

const stageEl =
document.getElementById("stage");

const timeEl =
document.getElementById("time");

const scoreEl =
document.getElementById("score");

const comboEl =
document.getElementById("combo");

const stageName =
document.getElementById("stageName");


/* ==================================================
HUD
================================================== */

function updateHUD(){

stageEl.textContent = stage + 1;

timeEl.textContent = time;

scoreEl.textContent =
Math.max(0,score).toLocaleString();

comboEl.textContent = combo;

}


/* ==================================================
汚れを全部削除
================================================== */

function clearDirt(){

game.querySelectorAll(".dirt")
.forEach(d => d.remove());

}


/* ==================================================
ステージ別の汚れ
================================================== */

function randomType(){

const list =
stages[stage].types;

return list[
Math.floor(Math.random()*list.length)
];

}


/* ==================================================
汚れ作成
================================================== */

function createDirt(){

if(!playing)return;

const d =
document.createElement("div");

const type =
randomType();

d.className =
"dirt " + type;


/* =========================
ステージが進むほど
少しずつ小さくして難しくする
========================= */

const sizeBonus =
Math.max(0,stage*2);

d.style.transform =
"scale("+(1-sizeBonus/100)+")";


/* =========================
ランダム配置
========================= */

const left =
5 + Math.random()*82;

const top =
8 + Math.random()*82;

d.style.left = left+"%";

d.style.top = top+"%";


/* =========================
得点
========================= */

let basePoint = 100;

if(type==="dust"){
basePoint=100;
}

if(type==="oil"){
basePoint=180;
}

if(type==="water"){
basePoint=220;
}

if(type==="mold"){
basePoint=250;
}

if(type==="burn"){
basePoint=350;
}

if(type==="gold"){
basePoint=1000;
}


/* =========================
タップ
========================= */

d.addEventListener("pointerdown",function(e){

e.stopPropagation();

if(!playing)return;


/* 連続コンボ */

combo++;


/* コンボ倍率 */

const multiplier =
1 + Math.min(combo-1,20)*0.05;


/* 加点 */

const add =
Math.round(basePoint*multiplier);

score += add;


/* 汚れを消す */

d.remove();


/* 表示 */

showFloat(
"+"+add,
true
);


/* HUD */

updateHUD();

});


game.appendChild(d);

}


/* ==================================================
得点表示
================================================== */

function showFloat(text,good){

const f =
document.createElement("div");

f.className =
"float "+(good ? "good":"bad");

f.textContent = text;

f.style.left =
(30+Math.random()*35)+"%";

f.style.top =
(35+Math.random()*30)+"%";

game.appendChild(f);

setTimeout(()=>{
f.remove();
},700);

}


/* ==================================================
間違いタップ
================================================== */

function wrongTap(){

if(!playing)return;


/* =========================
−100点
========================= */

score -= 100;

if(score < 0){
score = 0;
}


/* =========================
コンボリセット
========================= */

combo = 0;


/* 表示 */

showFloat("−100",false);


/* 赤フラッシュ */

const flash =
document.createElement("div");

flash.className="flash";

game.appendChild(flash);

setTimeout(()=>{
flash.remove();
},300);


/* HUD */

updateHUD();

}


/* ==================================================
ゲームエリアの空振り
================================================== */

game.addEventListener("pointerdown",function(e){

/*
汚れ以外をタップした場合だけ
ミス扱い
*/

if(
e.target === game ||
e.target === stageName
){

wrongTap();

}

});


/* ==================================================
ステージ開始
================================================== */

function startStage(){

const s =
stages[stage];


/* 古いタイマー停止 */

clearInterval(timer);


/* 汚れ削除 */

clearDirt();


/* 背景変更 */

game.className =
"game "+s.className;


/* ステージ名 */

stageName.textContent =
s.name;


/* 時間 */

time = s.time;


/* ステージ開始時に
コンボだけリセット */

combo = 0;


/* HUD */

updateHUD();


/* =========================
最初の汚れ
========================= */

for(
let i=0;
i<s.maxDirt;
i++
){

createDirt();

}


/* ==================================================
タイマー

ここでは絶対に
「汚れを全部消した」
ことではステージ変更しない。

時間が0になった時だけ。
================================================== */

timer =
setInterval(function(){

if(!playing)return;

time--;

updateHUD();


if(time <= 0){

clearInterval(timer);

nextStage();

}

},1000);

}


/* ==================================================
汚れ補充
================================================== */

function refillDirt(){

if(!playing)return;

const max =
stages[stage].maxDirt;

const current =
game.querySelectorAll(".dirt").length;


/*
減った分だけ補充。

ただし、
補充してもステージは変わらない。
*/

if(current < max){

createDirt();

}

}


/* ==================================================
次ステージ
================================================== */

function nextStage(){

if(!playing)return;


/*
まだステージがある
*/

if(stage < stages.length-1){

stage++;

startStage();

return;

}


/*
全ステージ終了
*/

endGame();

}


/* ==================================================
ゲーム終了
================================================== */

function endGame(){

playing=false;

clearInterval(timer);

clearInterval(refillTimer);

clearDirt();

document.getElementById("finalScore")
.textContent =
score.toLocaleString()+"点";

document.getElementById("result")
.style.display="block";

}


/* ==================================================
自動補充タイマー

約0.8秒ごと。

全部消しても
即ステージ変更は絶対しない。
================================================== */

refillTimer =
setInterval(function(){

refillDirt();

},800);


/* ==================================================
ゲーム開始
================================================== */

startStage();

</script>

</body>
</html>
