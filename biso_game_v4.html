<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>美装職人！クリーンマスター</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:#071222;
  color:#fff;
}

body{
  overflow-x:hidden;
}

#app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:clamp(25px,6vw,42px);
  margin:5px 0;
  font-weight:900;
}

.subtitle{
  text-align:center;
  font-size:clamp(14px,3.8vw,22px);
  font-weight:800;
  color:#dbe8ff;
  margin-bottom:14px;
}

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}

.hudBox{
  background:#162a46;
  border-radius:16px;
  padding:10px 5px;
  text-align:center;
}

.hudNum{
  font-size:clamp(22px,6vw,34px);
  font-weight:900;
  line-height:1.1;
}

.hudLabel{
  margin-top:4px;
  font-size:12px;
  color:#cbd8eb;
  font-weight:700;
}

#game{
  position:relative;
  width:100%;
  height:min(76vh,720px);
  min-height:500px;
  border:5px solid #365a82;
  border-radius:30px;
  overflow:hidden;
  touch-action:manipulation;
}

/* ステージ背景 */

#game.stage1{
  background:
  linear-gradient(135deg,#fff0c9 0 45%,#d9bd88 45% 100%);
}

#game.stage2{
  background:
  linear-gradient(135deg,#dff7ff 0 50%,#9fcce2 50% 100%);
}

#game.stage3{
  background:
  linear-gradient(135deg,#dff3ff 0 35%,#b6d8e8 35% 70%,#edf7fa 70%);
}

#game.stage4{
  background:
  linear-gradient(135deg,#eee1cf 0 30%,#c8b298 30% 65%,#ead9c4 65%);
}

#game.stage5{
  background:
  linear-gradient(135deg,#e9e9e9 0 35%,#c9c9c9 35% 70%,#f4f4f4 70%);
}

.sceneTitle{
  position:absolute;
  top:14px;
  left:18px;
  font-size:clamp(18px,5vw,30px);
  font-weight:900;
  color:rgba(25,45,65,.35);
  pointer-events:none;
}

/* 汚れ */

.dirt{
  position:absolute;
  width:68px;
  height:46px;
  border-radius:50%;
  cursor:pointer;
  z-index:5;
  box-shadow:0 8px 12px rgba(0,0,0,.25);
  transition:transform .1s,opacity .15s;
}

.dirt:active{
  transform:scale(.82);
}

.dirt.brown{
  background:
  radial-gradient(
    circle at 50% 45%,
    #91684e 0 30%,
    #673a22 31% 100%
  );
}

.dirt.grease{
  background:
  radial-gradient(
    circle at 40% 40%,
    #f3d35c 0 18%,
    #b78a19 19% 50%,
    #73500c 51% 100%
  );
}

.dirt.water{
  background:
  radial-gradient(
    circle at 35% 30%,
    #c7f4ff 0 10%,
    #4ab5ed 11% 55%,
    #2874b6 56% 100%
  );
  box-shadow:0 0 17px rgba(70,190,255,.8);
}

.dirt.mold{
  background:
  radial-gradient(
    circle at 35% 40%,
    #6ba84e 0 20%,
    #315b31 21% 55%,
    #203b26 56% 100%
  );
}

.dirt.foam{
  background:
  radial-gradient(
    circle at 30% 30%,
    #fff 0 15%,
    #cfe7ef 16% 50%,
    #8eafb9 51% 100%
  );
}

.dirt.taken{
  opacity:0;
  transform:scale(1.5);
  pointer-events:none;
}

/* エフェクト */

.hitText,
.missText{
  position:absolute;
  z-index:30;
  pointer-events:none;
  font-weight:900;
  font-size:27px;
  text-shadow:0 3px 8px #000;
  animation:floatText .6s ease-out forwards;
}

.hitText{
  color:#fff;
}

.missText{
  color:#ff6565;
}

@keyframes floatText{
  0%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  100%{
    opacity:0;
    transform:translateY(-60px) scale(1.25);
  }
}

/* 結果画面 */

#result{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(4,14,28,.97);
  padding:20px 12px;
  overflow:auto;
}

.resultCard{
  width:100%;
  max-width:720px;
  margin:20px auto;
  background:#1a3153;
  border:5px solid #456b96;
  border-radius:30px;
  padding:30px 20px;
  text-align:center;
}

.trophy{
  font-size:65px;
}

.resultTitle{
  font-size:clamp(32px,8vw,52px);
  font-weight:900;
  margin:8px 0;
}

.resultLabel{
  font-size:20px;
  font-weight:800;
}

.finalScore{
  color:#ffc64d;
  font-size:clamp(55px,14vw,100px);
  font-weight:900;
  line-height:1;
  margin:12px 0 25px;
}

.rankBox{
  background:#091a32;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}

.rankTitle{
  font-size:24px;
  font-weight:900;
  margin-bottom:15px;
}

.rankRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 5px;
  border-bottom:1px solid #29435f;
  font-size:18px;
  font-weight:800;
}

.rankRow:last-child{
  border-bottom:0;
}

.restart{
  border:0;
  border-radius:18px;
  background:#4ddc9a;
  color:#062018;
  font-size:22px;
  font-weight:900;
  padding:18px 45px;
  cursor:pointer;
}

@media(max-width:600px){

  #app{
    padding:9px;
  }

  #game{
    height:72vh;
    min-height:500px;
    border-radius:24px;
  }

  .hud{
    gap:5px;
  }

  .hudBox{
    padding:8px 3px;
    border-radius:13px;
  }

  .dirt{
    width:60px;
    height:42px;
  }

}
</style>
</head>

<body>

<div id="app">

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="subtitle">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">

<div class="hudBox">
<div id="stageNum" class="hudNum">1</div>
<div class="hudLabel">ステージ</div>
</div>

<div class="hudBox">
<div id="timeNum" class="hudNum">30</div>
<div class="hudLabel">残り時間</div>
</div>

<div class="hudBox">
<div id="scoreNum" class="hudNum">0</div>
<div class="hudLabel">スコア</div>
</div>

<div class="hudBox">
<div id="comboNum" class="hudNum">0</div>
<div class="hudLabel">コンボ</div>
</div>

</div>

<div id="game" class="stage1">
<div id="sceneTitle" class="sceneTitle">
🍳 KITCHEN
</div>
</div>

</div>


<!-- 結果画面 -->

<div id="result">

<div class="resultCard">

<div class="trophy">🏆</div>

<div class="resultTitle">
ゲーム終了！
</div>

<div class="resultLabel">
あなたのスコア
</div>

<div id="finalScore" class="finalScore">
0点
</div>


<div class="rankBox">

<div class="rankTitle">
🏆 あなたのランキング
</div>

<div class="rankRow">
<span>🥇 リュウタ</span>
<strong id="rankScore">0点</strong>
</div>

<div class="rankRow">
<span>🥈 テスト</span>
<strong>100点</strong>
</div>

</div>


<button class="restart" onclick="restartGame()">
もう一度！
</button>

</div>

</div>


<script>

const STAGE_TIME = 30;
const TOTAL_STAGES = 5;


/* ゲーム状態 */

let stage = 1;
let score = 0;
let combo = 0;
let timeLeft = STAGE_TIME;

let timer = null;

let gameRunning = false;
let stageChanging = false;


/* HTML */

const game =
document.getElementById("game");

const stageNum =
document.getElementById("stageNum");

const timeNum =
document.getElementById("timeNum");

const scoreNum =
document.getElementById("scoreNum");

const comboNum =
document.getElementById("comboNum");

const sceneTitle =
document.getElementById("sceneTitle");

const result =
document.getElementById("result");

const finalScore =
document.getElementById("finalScore");

const rankScore =
document.getElementById("rankScore");


/* ステージ設定 */

const stages = {

1:{
  name:"🍳 KITCHEN",
  className:"stage1",
  types:["brown","grease"],
  count:15
},

2:{
  name:"🛁 BATHROOM",
  className:"stage2",
  types:["water","mold","foam"],
  count:18
},

3:{
  name:"🪟 WINDOW",
  className:"stage3",
  types:["water","brown","foam"],
  count:21
},

4:{
  name:"🛋️ LIVING ROOM",
  className:"stage4",
  types:["brown","mold","foam"],
  count:24
},

5:{
  name:"🚽 TOILET",
  className:"stage5",
  types:["brown","mold","grease"],
  count:27
}

};


/* ランダム */

function random(min,max){

  return Math.floor(
    Math.random()*(max-min+1)
  )+min;

}


/* HUD */

function updateHUD(){

  stageNum.textContent =
    stage;

  timeNum.textContent =
    timeLeft;

  scoreNum.textContent =
    score.toLocaleString();

  comboNum.textContent =
    combo;

}


/* ステージ開始 */

function setupStage(){

  stageChanging = false;

  game.className =
    stages[stage].className;

  sceneTitle.textContent =
    stages[stage].name;


  document
    .querySelectorAll(".dirt")
    .forEach(el=>el.remove());


  spawnDirtWave();


  timeLeft =
    STAGE_TIME;

  updateHUD();

}


/*
 * 汚れを1回分出す
 */

function spawnDirtWave(){

  const data =
    stages[stage];

  const positions = [];


  for(let i=0;i<data.count;i++){

    let x;
    let y;

    let valid=false;

    let attempts=0;


    while(!valid && attempts<100){

      x=random(6,90);
      y=random(8,90);

      valid=true;


      for(const p of positions){

        const dx=x-p.x;
        const dy=y-p.y;

        if(
          Math.sqrt(dx*dx+dy*dy)<10
        ){

          valid=false;
          break;

        }

      }

      attempts++;

    }


    positions.push({
      x:x,
      y:y
    });


    const dirt =
      document.createElement("div");


    const type =
      data.types[
        random(
          0,
          data.types.length-1
        )
      ];


    dirt.className =
      "dirt "+type;


    dirt.style.left =
      x+"%";

    dirt.style.top =
      y+"%";


    dirt.addEventListener(
      "pointerdown",
      function(e){

        e.stopPropagation();

        if(!gameRunning) return;

        cleanDirt(
          dirt,
          e
        );

      }
    );


    game.appendChild(dirt);

  }

}


/*
 * 掃除
 */

function cleanDirt(dirt,e){

  if(
    dirt.classList.contains("taken")
  ){
    return;
  }


  dirt.classList.add("taken");


  combo++;


  /*
   * コンボ加点
   */

  let points =
    100 * combo;


  score += points;


  showEffect(
    e.clientX,
    e.clientY,
    "+"+points,
    false
  );


  updateHUD();


  /*
   * 全部消えたら
   * 同じステージに新しい汚れを追加
   */

  setTimeout(()=>{

    const remaining =
      document.querySelectorAll(
        ".dirt:not(.taken)"
      ).length;


    if(
      remaining===0 &&
      gameRunning
    ){

      spawnDirtWave();

    }

  },200);

}


/*
 * 空振り
 */

game.addEventListener(
  "pointerdown",
  function(e){

    if(!gameRunning) return;


    /*
     * 汚れを押した場合は
     * ここでは減点しない
     */

    if(
      e.target.classList.contains("dirt")
    ){
      return;
    }


    /*
     * 空白を押したら減点
     */

    score -= 100;


    /*
     * 0点以下にはしない
     */

    if(score<0){
      score=0;
    }


    /*
     * コンボリセット
     */

    combo=0;


    showEffect(
      e.clientX,
      e.clientY,
      "-100",
      true
    );


    updateHUD();

  }
);


/*
 * エフェクト
 */

function showEffect(
  x,
  y,
  text,
  miss
){

  const rect =
    game.getBoundingClientRect();


  const el =
    document.createElement("div");


  el.className =
    miss
    ? "missText"
    : "hitText";


  el.textContent =
    text;


  el.style.left =
    (x-rect.left-20)+"px";


  el.style.top =
    (y-rect.top-25)+"px";


  game.appendChild(el);


  setTimeout(
    ()=>{
      el.remove();
    },
    600
  );

}


/*
 * タイマー
 */

function startTimer(){

  clearInterval(timer);


  timer =
    setInterval(
      ()=>{

        if(!gameRunning){
          return;
        }


        timeLeft--;


        updateHUD();


        /*
         * 時間切れ
         */

        if(timeLeft<=0){

          nextStage();

        }

      },
      1000
    );

}


/*
 * 次のステージ
 */

function nextStage(){

  if(stageChanging){
    return;
  }


  stageChanging=true;


  if(stage>=TOTAL_STAGES){

    endGame();

    return;

  }


  stage++;


  combo=0;


  setupStage();

}


/*
 * ゲーム終了
 */

function endGame(){

  gameRunning=false;

  clearInterval(timer);


  finalScore.textContent =
    score.toLocaleString()+"点";


  rankScore.textContent =
    score.toLocaleString()+"点";


  result.style.display =
    "block";

}


/*
 * ゲーム開始
 */

function startGame(){

  clearInterval(timer);


  stage=1;

  score=0;

  combo=0;

  timeLeft=
    STAGE_TIME;


  gameRunning=true;

  stageChanging=false;


  result.style.display =
    "none";


  setupStage();


  startTimer();

}


/*
 * もう一度
 */

function restartGame(){

  startGame();

}


/*
 * 開いた瞬間ゲーム開始
 */

window.addEventListener(
  "load",
  function(){

    startGame();

  }
);

</script>

</body>
</html>
