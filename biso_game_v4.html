<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美装職人！クリーンマスター</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08111f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:25px;
  margin:6px 0 2px;
}

.sub{
  text-align:center;
  color:#b9c5d8;
  font-weight:700;
  margin-bottom:12px;
}

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:10px;
}

.card{
  background:#17263d;
  border-radius:18px;
  padding:12px 4px;
  text-align:center;
}

.num{
  font-size:23px;
  font-weight:900;
}

.label{
  color:#9eacc2;
  font-size:12px;
  margin-top:3px;
}

#combo{
  color:#ffb84d;
}

#game{
  position:relative;
  height:62vh;
  min-height:470px;
  max-height:620px;
  overflow:hidden;
  border-radius:28px;
  background:#1a2435;
  border:1px solid #35445d;
}

.scene{
  position:absolute;
  inset:0;
  display:none;
}

.scene.active{
  display:block;
}

.kitchen{
  background:
  linear-gradient(#dcecff 0 43%,#c9d9e7 43% 46%,#777 46% 100%);
}

.bath{
  background:
  linear-gradient(#d9f0ff 0 52%,#b8cad6 52% 56%,#8b9299 56% 100%);
}

.aircon{
  background:
  linear-gradient(#e9f5ff 0 55%,#d1d8de 55% 59%,#9b9b9b 59% 100%);
}

.room{
  background:
  linear-gradient(#f3e9d5 0 58%,#b38c66 58% 100%);
}

.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:42%;
  background:repeating-linear-gradient(
    0deg,
    #777 0,
    #777 35px,
    #666 36px,
    #666 38px
  );
}

.object{
  position:absolute;
  user-select:none;
}

.cab{
  left:8%;
  bottom:16%;
  width:84%;
  height:26%;
  background:#b77a43;
  border:7px solid #81532e;
  border-radius:10px;
}

.sink{
  left:32%;
  bottom:34%;
  width:36%;
  height:13%;
  background:#dce5e9;
  border-radius:50%;
  border:5px solid #89979f;
}

.bathTub{
  left:10%;
  bottom:20%;
  width:80%;
  height:25%;
  background:#edf5f7;
  border-radius:35px 35px 15px 15px;
  border:5px solid #9aa9b0;
}

.shower{
  right:13%;
  top:14%;
  width:22%;
  height:45%;
  border-right:10px solid #737f88;
  border-radius:50%;
}

.ac{
  left:17%;
  top:18%;
  width:66%;
  height:19%;
  background:#f8fbff;
  border:5px solid #a9b4bd;
  border-radius:12px;
}

.sofa{
  left:10%;
  bottom:12%;
  width:80%;
  height:30%;
  background:#687080;
  border-radius:25px 25px 10px 10px;
}

.dirt{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#493522;
  box-shadow:inset 0 0 0 8px rgba(0,0,0,.15);
  cursor:pointer;
  transition:.15s;
}

.dirt:active{
  transform:scale(.8);
}

.dirt.small{
  width:42px;
  height:42px;
}

.dirt.gone{
  transform:scale(0);
  opacity:0;
  pointer-events:none;
}

.message{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(4,10,20,.82);
  padding:9px 16px;
  border-radius:999px;
  font-weight:800;
  z-index:20;
  white-space:nowrap;
}

.start{
  position:absolute;
  inset:0;
  z-index:30;
  background:rgba(8,17,31,.93);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.panel{
  width:100%;
  max-width:560px;
  background:#17263d;
  border:1px solid #3a4d6b;
  border-radius:28px;
  padding:28px 20px;
  text-align:center;
}

.panel .faces{
  font-size:58px;
  margin-bottom:10px;
}

.panel h2{
  font-size:30px;
  margin:8px 0 14px;
}

.panel p{
  color:#d5deeb;
  line-height:1.7;
  font-weight:700;
}

button{
  border:0;
  border-radius:16px;
  padding:15px 24px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  background:#55df9c;
  color:#062017;
}

.secondary{
  background:#33445f;
  color:#fff;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}

.result{
  display:none;
  position:absolute;
  inset:0;
  z-index:40;
  background:rgba(8,17,31,.96);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.result.show{
  display:flex;
}

.scoreBig{
  font-size:50px;
  font-weight:1000;
  color:#ffcb63;
}

.rank{
  font-size:25px;
  font-weight:900;
  margin:10px 0;
}

.friendBox{
  margin-top:20px;
  padding:18px;
  background:#0d192c;
  border-radius:20px;
}

input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:0;
  font-size:18px;
  margin:10px 0;
}

.challenge{
  margin-top:12px;
  color:#aebbd0;
  font-size:13px;
}

.footer{
  text-align:center;
  color:#65738a;
  font-size:12px;
  padding:12px;
}
  .result{
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  align-items:flex-start;
  justify-content:center;
  touch-action:pan-y;
}

.result.show{
  display:flex;
}

.result .panel{
  margin:20px auto;
  flex:0 0 auto;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！ランキング＆挑戦状🔥
</div>

<div class="hud">
  <div class="card">
    <div class="num" id="stage">1</div>
    <div class="label">ステージ</div>
  </div>

  <div class="card">
    <div class="num" id="time">30</div>
    <div class="label">残り秒数</div>
  </div>

  <div class="card">
    <div class="num" id="score">0</div>
    <div class="label">スコア</div>
  </div>

  <div class="card">
    <div class="num" id="combo">0</div>
    <div class="label">コンボ🔥</div>
  </div>
</div>

<div id="game">

  <div class="start" id="start">
    <div class="panel">
      <div class="faces">🐉 🐶</div>
      <h2>美装職人！Ver.5</h2>
      <p>
        汚れをタップして落とせ！<br>
        4ステージを制覇して<br>
        友達のスコアにも挑戦しよう🔥
      </p>

      <div class="buttons">
        <button class="primary" onclick="startGame()">
          現場へ出発！
        </button>
      </div>
    </div>
  </div>

  <div class="scene kitchen active" id="scene1">
    <div class="floor"></div>
    <div class="object cab"></div>
    <div class="object sink"></div>
  </div>

  <div class="scene bath" id="scene2">
    <div class="object bathTub"></div>
    <div class="object shower"></div>
  </div>

  <div class="scene aircon" id="scene3">
    <div class="object ac"></div>
  </div>

  <div class="scene room" id="scene4">
    <div class="object sofa"></div>
    <div class="floor"></div>
  </div>

  <div class="message" id="message">
    汚れを全部落とせ！
  </div>

  <div id="dirtLayer"></div>

  <div class="result" id="result">
    <div class="panel">

      <div class="faces">🐉 🐶</div>

      <h2 id="resultTitle">
        全ステージ制覇！
      </h2>

      <div class="rank">
        👑 伝説の美装職人
      </div>

      <div class="scoreBig" id="finalScore">
        0
      </div>

      <p id="resultText">
        友達にも挑戦してもらおう！
      </p>

      <div class="friendBox">

        <b>⚔️ 友達のスコアに挑戦</b>

        <input
          id="friendScore"
          type="number"
          placeholder="友達のスコアを入力"
        >

        <button
          class="primary"
          onclick="judgeFriend()">
          勝負判定！
        </button>

        <div id="judgeResult"></div>

      </div>

      <div class="buttons">

        <button
          class="primary"
          onclick="restartGame()">
          もう一度！
        </button>

        <button
          class="secondary"
          onclick="shareChallenge()">
          𝕏 挑戦状をシェア
        </button>

      </div>

      <div class="challenge">
        「俺より高得点出してみて！」🔥
      </div>

    </div>
  </div>

</div>

<div class="footer">
美装職人！クリーンマスター
</div>

</div>

<script>

let stage=1;
let score=0;
let combo=0;
let time=30;
let timer=null;
let remaining=0;
let playing=false;

const stageNames=[
  "",
  "キッチン現場",
  "浴室現場",
  "エアコン現場",
  "お部屋現場"
];

function $(id){
  return document.getElementById(id);
}

function updateHUD(){

  $("stage").textContent=stage;
  $("time").textContent=time;
  $("score").textContent=score;
  $("combo").textContent=combo;

}

function startGame(){

  $("start").style.display="none";
  $("result").classList.remove("show");

  stage=1;
  score=0;
  combo=0;
  time=30;
  playing=true;

  showStage();
  createDirt();

  clearInterval(timer);

  timer=setInterval(()=>{

    if(!playing)return;

    time--;

    updateHUD();

    if(time<=0){
      finishStage();
    }

  },1000);

  updateHUD();
}

function showStage(){

  document.querySelectorAll(".scene")
    .forEach(x=>x.classList.remove("active"));

  $("scene"+stage)
    .classList.add("active");

  $("message").textContent=
    stageNames[stage]+"！ 汚れを落とせ！";

}

function createDirt(){

  const layer=$("dirtLayer");

  layer.innerHTML="";

  remaining=stage===1?7:
            stage===2?8:
            stage===3?9:10;

  for(let i=0;i<remaining;i++){

    const d=document.createElement("div");

    d.className="dirt";

    if(i%3===0)d.classList.add("small");

    const x=8+Math.random()*78;
    const y=18+Math.random()*62;

    d.style.left=x+"%";
    d.style.top=y+"%";

    d.addEventListener("click",cleanDirt);

    layer.appendChild(d);

  }

}

function cleanDirt(e){

  if(!playing)return;

  const d=e.currentTarget;

  if(d.classList.contains("gone"))return;

  d.classList.add("gone");

  remaining--;

  combo++;

  const bonus=100+(combo*20);

  score+=bonus;

  updateHUD();

  if(remaining<=0){

    score+=1000;
    combo++;

    updateHUD();

    setTimeout(()=>{

      if(stage<4){

        stage++;
        time=30;

        showStage();
        createDirt();
        updateHUD();

      }else{

        finishGame();

      }

    },400);

  }

}

function finishStage(){

  if(!playing)return;

  if(remaining>0){

    combo=0;
    score=Math.max(0,score-100);
  }

  if(stage<4){

    stage++;
    time=30;

    showStage();
    createDirt();
    updateHUD();

  }else{

    finishGame();

  }

}

function finishGame(){

  playing=false;
  clearInterval(timer);

  const old=
    Number(localStorage.getItem("bisoHighScore")||0);

  if(score>old){
    localStorage.setItem("bisoHighScore",score);

    const popup=document.createElement("div");

    popup.innerHTML=
      "🔥<br><span>自己ベスト更新！</span><br>"+
      "<b>"+score+"点</b>";

    popup.style.position="fixed";
    popup.style.left="50%";
    popup.style.top="50%";
    popup.style.transform="translate(-50%,-50%)";
    popup.style.zIndex="99999";
    popup.style.textAlign="center";
    popup.style.padding="30px 45px";
    popup.style.borderRadius="25px";
    popup.style.background="#162a46";
    popup.style.border="4px solid #55e39a";
    popup.style.color="#fff";
    popup.style.fontSize="42px";
    popup.style.fontWeight="900";

    popup.querySelector("span").style.fontSize="30px";
    popup.querySelector("b").style.fontSize="48px";

    document.body.appendChild(popup);

    setTimeout(()=>{
      popup.remove();
    },1800);
  }

  $("finalScore").textContent=score+"点";

  const high=
    Math.max(
      score,
      Number(localStorage.getItem("bisoHighScore")||0)
    );

  $("resultText").innerHTML=
    (score>old ? "🔥 自己ベスト更新！<br>" : "")+
    "🏆 ハイスコア："+high+"点<br>"+
    "友達にも挑戦してもらおう！";

  $("result").classList.add("show");
}

  $("finalScore").textContent=score+"点";

  const high=
    Number(localStorage.getItem("bisoHighScore")||score);

  $("resultText").innerHTML=
(score>old ? "🔥 自己ベスト更新！<br>" : "")+
"🏆 ハイスコア："+high+"点<br>"+
"友達にも挑戦してもらおう！";

  $("result").classList.add("show");

}

function restartGame(){

  $("result").classList.remove("show");

  startGame();

}

function judgeFriend(){

  const friend=
    Number($("friendScore").value);

  if(!friend){

    $("judgeResult").innerHTML=
      "<p>友達のスコアを入力してな！😆</p>";

    return;
  }

  if(score>friend){

    $("judgeResult").innerHTML=
      "<p style='color:#55df9c;font-size:22px;font-weight:900'>"+
      "🔥 俺の勝ち！</p>"+
      "<p>"+score+"点 vs "+friend+"点</p>";

  }else if(score<friend){

    $("judgeResult").innerHTML=
      "<p style='color:#ff7d7d;font-size:22px;font-weight:900'>"+
      "😱 負けた！リベンジや！</p>"+
      "<p>"+score+"点 vs "+friend+"点</p>";

  }else{

    $("judgeResult").innerHTML=
      "<p style='font-size:22px;font-weight:900'>"+
      "🤝 引き分け！</p>";

  }

}

function shareChallenge(){

  const text=
`🧹 美装職人！クリーンマスター

👑 俺のスコア：${score}点

🔥 このスコア超えられる？
👉 俺より高得点出してみて！

#美装 #掃除 #ゲーム`;

  const url=
    location.href;

  const shareUrl=
    "https://twitter.com/intent/tweet?text="+
    encodeURIComponent(text)+
    "&url="+
    encodeURIComponent(url);

  window.open(shareUrl,"_blank");

}

updateHUD();

</script>

</body>
</html>
