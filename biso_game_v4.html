<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>美装職人！クリーンマスター</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#071222;
  color:#fff;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.container{
  width:min(900px,100%);
  margin:auto;
  padding:14px;
}

h1{
  text-align:center;
  margin:5px 0 3px;
  font-size:clamp(25px,6vw,48px);
  font-weight:900;
}

.subtitle{
  text-align:center;
  color:#dbe7f7;
  font-weight:800;
  font-size:clamp(14px,3.8vw,24px);
  margin-bottom:15px;
}

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

.hudBox{
  background:#162a46;
  border-radius:18px;
  padding:12px 5px;
  text-align:center;
}

.hudNum{
  font-size:clamp(22px,6vw,40px);
  font-weight:900;
  line-height:1.1;
}

.hudLabel{
  font-size:clamp(11px,2.7vw,17px);
  color:#dbe7f7;
  font-weight:700;
  margin-top:4px;
}

.game{
  position:relative;
  width:100%;
  height:min(78vh,720px);
  min-height:500px;
  border:5px solid #35587d;
  border-radius:28px;
  overflow:hidden;
  touch-action:manipulation;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

/* ステージ背景 */
.game.kitchen{
  background:
    linear-gradient(135deg,#fff1c9 0 48%,#d7ba87 48% 100%);
}

.game.bath{
  background:
    linear-gradient(135deg,#d9f7ff,#8ccde0);
}

.game.window{
  background:
    linear-gradient(180deg,#8fd6ff 0 45%,#cdefff 45% 100%);
}

.game.room{
  background:
    linear-gradient(135deg,#f4e3cf,#c69a70);
}

.game.floor{
  background:
    linear-gradient(135deg,#d8c4a4,#94724f);
}

.sceneTitle{
  position:absolute;
  top:16px;
  left:20px;
  z-index:5;
  color:rgba(30,40,50,.48);
  font-size:clamp(18px,5vw,30px);
  font-weight:900;
  pointer-events:none;
}

.dirt{
  position:absolute;
  width:58px;
  height:42px;
  border-radius:50%;
  background:#70401f;
  box-shadow:
    inset 0 -5px 0 rgba(0,0,0,.13),
    0 8px 12px rgba(0,0,0,.20);
  transform:translate(-50%,-50%) rotate(var(--r));
  z-index:10;
  animation:appear .18s ease-out;
}

.dirt:after{
  content:"";
  position:absolute;
  width:45%;
  height:40%;
  left:28%;
  top:20%;
  border-radius:50%;
  background:#936c50;
}

.dirt.yellow{
  background:#b68408;
  box-shadow:
    inset 0 -5px 0 rgba(0,0,0,.15),
    0 8px 12px rgba(0,0,0,.20);
}

.dirt.yellow:after{
  background:#ffd94a;
}

.dirt.blue{
  background:#385d73;
  border:4px solid #9be8ff;
  box-shadow:0 0 18px rgba(90,210,255,.65);
}

.dirt.blue:after{
  background:#66889b;
}

.dirt.green{
  background:#355c2c;
  border:3px solid #79c95d;
}

.dirt.green:after{
  background:#4f8245;
}

@keyframes appear{
  from{
    transform:translate(-50%,-50%) scale(.2) rotate(var(--r));
    opacity:0;
  }
  to{
    transform:translate(-50%,-50%) scale(1) rotate(var(--r));
    opacity:1;
  }
}

.hit{
  animation:hit .15s ease-out;
}

@keyframes hit{
  0%{transform:translate(-50%,-50%) scale(1);}
  50%{transform:translate(-50%,-50%) scale(1.3);}
  100%{transform:translate(-50%,-50%) scale(0);}
}

.flash{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:50;
  opacity:0;
}

.flash.bad{
  background:rgba(255,50,50,.25);
  animation:flash .25s;
}

.flash.good{
  background:rgba(50,255,150,.12);
  animation:flash .18s;
}

@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* スタート・結果画面 */
.overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(4,14,28,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.panel{
  width:min(720px,100%);
  background:#193655;
  border:5px solid #426b96;
  border-radius:30px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.panel h2{
  font-size:clamp(32px,9vw,58px);
  margin:8px 0 18px;
}

.panel p{
  color:#dbe7f7;
  font-size:clamp(15px,4vw,21px);
  line-height:1.7;
  font-weight:700;
}

.bigScore{
  color:#ffc94d;
  font-size:clamp(48px,14vw,90px);
  font-weight:900;
  margin:15px 0;
}

.mainButton{
  display:block;
  width:min(430px,100%);
  margin:22px auto 0;
  padding:18px 20px;
  border-radius:18px;
  background:#4bd99a;
  color:#062218;
  font-size:clamp(20px,5vw,28px);
  font-weight:900;
}

.mainButton:active{
  transform:scale(.97);
}

.hidden{
  display:none !important;
}

/* ランキング */
.rankBox{
  background:#0c1d35;
  border-radius:20px;
  padding:18px;
  margin-top:20px;
  text-align:left;
}

.rankTitle{
  text-align:center;
  font-size:22px;
  font-weight:900;
  margin-bottom:12px;
}

.rankRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 5px;
  border-bottom:1px solid #294360;
  font-size:17px;
  font-weight:800;
}

.rankRow:last-child{
  border-bottom:0;
}

.nameInput{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  font-size:18px;
  text-align:center;
  margin-top:10px;
}

.notice{
  min-height:28px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  margin:7px 0;
}

.badText{
  color:#ff7070;
}

.goodText{
  color:#64e6a8;
}

@media(max-width:600px){
  .container{
    padding:10px;
  }

  .hud{
    gap:7px;
  }

  .hudBox{
    border-radius:14px;
    padding:10px 3px;
  }

  .game{
    min-height:560px;
    height:72vh;
    border-width:4px;
    border-radius:22px;
  }

  .dirt{
    width:54px;
    height:39px;
  }

  .panel{
    padding:25px 18px;
    border-radius:24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🧹 美装職人！クリーンマスター</h1>

  <div class="subtitle">
    🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
  </div>

  <div class="hud">
    <div class="hudBox">
      <div class="hudNum" id="stage">1</div>
      <div class="hudLabel">ステージ</div>
    </div>

    <div class="hudBox">
      <div class="hudNum" id="time">30</div>
      <div class="hudLabel">残り時間</div>
    </div>

    <div class="hudBox">
      <div class="hudNum" id="score">0</div>
      <div class="hudLabel">スコア</div>
    </div>

    <div class="hudBox">
      <div class="hudNum" id="combo">0</div>
      <div class="hudLabel">コンボ</div>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="game kitchen" id="game">
    <div class="sceneTitle" id="sceneTitle">🔍 KITCHEN</div>
    <div class="flash" id="flash"></div>
  </div>

</div>


<!-- スタート画面 -->
<div class="overlay" id="startOverlay">
  <div class="panel">

    <div style="font-size:70px;">🧹</div>

    <h2>クリーンマスター</h2>

    <p>
      汚れを見つけてタップ！<br>
      正しい汚れを消すと得点＆コンボアップ！<br>
      間違えると<strong style="color:#ff7070;">−500点</strong>！
    </p>

    <p>
      全5ステージを制限時間内に攻略しよう🔥
    </p>

    <button class="mainButton" id="startButton">
      ▶ スタート
    </button>

  </div>
</div>


<!-- 結果画面 -->
<div class="overlay hidden" id="resultOverlay">
  <div class="panel">

    <div style="font-size:65px;">🏆</div>

    <h2>ゲーム終了！</h2>

    <div>あなたのスコア</div>

    <div class="bigScore" id="finalScore">0点</div>

    <div id="rankArea"></div>

    <button class="mainButton" id="retryButton">
      もう一度！
    </button>

  </div>
</div>


<script>
"use strict";

/* =========================
   基本設定
========================= */

const TOTAL_STAGES = 5;

const STAGES = [
  {
    name:"🔍 KITCHEN",
    className:"kitchen",
    time:30,
    dirtCount:16
  },
  {
    name:"🛁 BATH",
    className:"bath",
    time:28,
    dirtCount:19
  },
  {
    name:"🪟 WINDOW",
    className:"window",
    time:27,
    dirtCount:22
  },
  {
    name:"🛋️ ROOM",
    className:"room",
    time:25,
    dirtCount:25
  },
  {
    name:"🧹 FLOOR",
    className:"floor",
    time:23,
    dirtCount:28
  }
];


/* =========================
   状態
========================= */

let stage = 1;
let timeLeft = 30;
let score = 0;
let combo = 0;

let playing = false;
let timer = null;
let refillTimer = null;

let remainingDirt = 0;


/* =========================
   DOM
========================= */

const game = document.getElementById("game");
const stageEl = document.getElementById("stage");
const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const sceneTitle = document.getElementById("sceneTitle");
const notice = document.getElementById("notice");
const flash = document.getElementById("flash");

const startOverlay = document.getElementById("startOverlay");
const resultOverlay = document.getElementById("resultOverlay");

const startButton = document.getElementById("startButton");
const retryButton = document.getElementById("retryButton");

const finalScore = document.getElementById("finalScore");
const rankArea = document.getElementById("rankArea");


/* =========================
   表示更新
========================= */

function updateHUD(){
  stageEl.textContent = stage;
  timeEl.textContent = timeLeft;
  scoreEl.textContent = Math.max(0,score).toLocaleString();
  comboEl.textContent = combo;
}


/* =========================
   メッセージ
========================= */

function showNotice(text,type=""){
  notice.textContent = text;
  notice.className = "notice " + type;

  setTimeout(()=>{
    if(notice.textContent === text){
      notice.textContent = "";
    }
  },700);
}


/* =========================
   背景
========================= */

function setBackground(){
  game.className = "game " + STAGES[stage-1].className;
  sceneTitle.textContent = STAGES[stage-1].name;
}


/* =========================
   汚れを全部消す
========================= */

function clearDirt(){
  document.querySelectorAll(".dirt").forEach(el=>el.remove());
  remainingDirt = 0;
}


/* =========================
   ランダム位置
========================= */

function randomPosition(){

  /*
    上下左右に余白を作る。
    スマホでも画面外に出にくくする。
  */

  const x = 7 + Math.random() * 86;
  const y = 9 + Math.random() * 84;

  return {x,y};
}


/* =========================
   汚れ生成
========================= */

function createDirt(count){

  const colors = ["","", "", "yellow","blue"];

  for(let i=0;i<count;i++){

    const dirt = document.createElement("div");

    dirt.className = "dirt";

    const color =
      colors[Math.floor(Math.random()*colors.length)];

    if(color){
      dirt.classList.add(color);
    }

    const pos = randomPosition();

    dirt.style.left = pos.x + "%";
    dirt.style.top = pos.y + "%";

    dirt.style.setProperty(
      "--r",
      ((Math.random()*40)-20) + "deg"
    );

    /*
      クリック時にゲーム判定。
    */
    dirt.addEventListener("pointerdown",function(e){

      e.preventDefault();
      e.stopPropagation();

      if(!playing) return;

      cleanDirt(dirt);

    });

    game.appendChild(dirt);

    remainingDirt++;
  }
}


/* =========================
   汚れを掃除
========================= */

function cleanDirt(dirt){

  if(!dirt || !dirt.isConnected) return;

  /*
    正解
  */

  combo++;

  /*
    基本点
    コンボが高いほど少し増える
  */

  const gain = 300 + Math.min(combo,20)*50;

  score += gain;

  remainingDirt--;

  dirt.classList.add("hit");

  flash.className = "flash good";

  setTimeout(()=>{
    if(dirt.isConnected){
      dirt.remove();
    }
  },120);

  showNotice("✨ +" + gain + "点","goodText");

  updateHUD();

  /*
    汚れが少なくなったら追加。
    すぐステージ変更はしない。
  */

  if(remainingDirt <= 4){
    setTimeout(()=>{
      if(playing && timeLeft > 0){
        createDirt(8 + stage * 2);
      }
    },250);
  }
}


/* =========================
   ゲーム画面の空白をタップ
========================= */

game.addEventListener("pointerdown",function(e){

  if(!playing) return;

  /*
    汚れ自身のクリックは stopPropagation
    されるのでここには来ない。
    つまりここに来たらミス。
  */

  combo = 0;

  score -= 500;

  /*
    スコアはマイナス表示にしない。
  */

  if(score < 0){
    score = 0;
  }

  flash.className = "flash bad";

  showNotice("❌ ミス！ −500点","badText");

  updateHUD();
});


/* =========================
   ステージ開始
========================= */

function startStage(){

  clearDirt();

  setBackground();

  const data = STAGES[stage-1];

  timeLeft = data.time;

  /*
    ステージ開始時は多めに汚れを配置。
  */

  createDirt(data.dirtCount);

  updateHUD();

  showNotice(
    "🔥 STAGE " + stage + " START!",
    "goodText"
  );

  /*
    追加生成。
    全部消しても時間が残っている限り続く。
  */

  clearInterval(refillTimer);

  refillTimer = setInterval(()=>{

    if(!playing) return;

    if(timeLeft <= 0) return;

    /*
      画面の汚れが少なくなったら追加。
    */

    if(remainingDirt < 8){
      createDirt(7 + stage * 2);
    }

  },1600);
}


/* =========================
   タイマー
========================= */

function startTimer(){

  clearInterval(timer);

  timer = setInterval(()=>{

    if(!playing) return;

    timeLeft--;

    if(timeLeft < 0){
      timeLeft = 0;
    }

    updateHUD();

    if(timeLeft <= 0){

      clearInterval(timer);
      clearInterval(refillTimer);

      /*
        ステージ終了
      */

      setTimeout(()=>{
        nextStage();
      },350);
    }

  },1000);
}


/* =========================
   次のステージ
========================= */

function nextStage(){

  if(!playing) return;

  if(stage >= TOTAL_STAGES){

    finishGame();

    return;
  }

  stage++;

  startStage();

  /*
    タイマーを再スタート。
  */

  startTimer();
}


/* =========================
   ゲーム開始
========================= */

function startGame(){

  clearInterval(timer);
  clearInterval(refillTimer);

  stage = 1;
  score = 0;
  combo = 0;

  playing = true;

  startOverlay.classList.add("hidden");
  resultOverlay.classList.add("hidden");

  startStage();
  startTimer();

  updateHUD();
}


/* =========================
   ランキング取得
========================= */

function getRanking(){

  try{

    const data =
      JSON.parse(localStorage.getItem("cleanMasterRanking") || "[]");

    if(Array.isArray(data)){
      return data;
    }

  }catch(e){}

  return [];
}


/* =========================
   ランキング保存
========================= */

function saveRanking(){

  const ranking = getRanking();

  ranking.push({
    name:"リュウタ",
    score:score,
    date:new Date().toLocaleDateString("ja-JP")
  });

  ranking.sort((a,b)=>b.score-a.score);

  const top10 = ranking.slice(0,10);

  try{
    localStorage.setItem(
      "cleanMasterRanking",
      JSON.stringify(top10)
    );
  }catch(e){}

  return top10;
}


/* =========================
   ランキング表示
========================= */

function renderRanking(ranking){

  let html = `
    <div class="rankBox">
      <div class="rankTitle">🏆 あなたのランキング</div>
  `;

  if(ranking.length === 0){

    html += `
      <div class="rankRow">
        <span>まだ記録なし</span>
        <span>-</span>
      </div>
    `;

  }else{

    ranking.forEach((item,index)=>{

      let medal = "";

      if(index === 0) medal = "🥇";
      else if(index === 1) medal = "🥈";
      else if(index === 2) medal = "🥉";
      else medal = (index+1) + "位";

      html += `
        <div class="rankRow">
          <span>${medal} ${escapeHTML(item.name)}</span>
          <span>${Number(item.score).toLocaleString()}点</span>
        </div>
      `;

    });

  }

  html += `</div>`;

  rankArea.innerHTML = html;
}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   ゲーム終了
========================= */

function finishGame(){

  playing = false;

  clearInterval(timer);
  clearInterval(refillTimer);

  clearDirt();

  finalScore.textContent =
    Math.max(0,score).toLocaleString() + "点";

  const ranking = saveRanking();

  renderRanking(ranking);

  resultOverlay.classList.remove("hidden");
}


/* =========================
   ボタン
========================= */

startButton.addEventListener("click",function(){

  startGame();

});


retryButton.addEventListener("click",function(){

  startGame();

});


/* =========================
   初期状態
========================= */

function init(){

  /*
    最初は絶対にゲームを開始しない。
    スタート画面を表示。
  */

  playing = false;

  clearInterval(timer);
  clearInterval(refillTimer);

  clearDirt();

  stage = 1;
  timeLeft = STAGES[0].time;
  score = 0;
  combo = 0;

  setBackground();
  updateHUD();

  startOverlay.classList.remove("hidden");
  resultOverlay.classList.add("hidden");
}


/* =========================
   起動
========================= */

init();

</script>

</body>
</html>
