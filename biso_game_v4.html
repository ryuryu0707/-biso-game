<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>美装職人！クリーンマスター</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#08111f;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:12px;
}

/* =========================
   HEADER
========================= */

h1{
  text-align:center;
  font-size:25px;
  margin:6px 0 3px;
  font-weight:900;
}

.sub{
  text-align:center;
  font-size:15px;
  font-weight:800;
  color:#dbe5f5;
  margin-bottom:14px;
}

/* =========================
   HUD
========================= */

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}

.hudBox{
  background:#162a46;
  border-radius:18px;
  padding:9px 3px;
  text-align:center;
}

.hudNum{
  font-size:25px;
  font-weight:900;
}

.hudLabel{
  color:#b9c7da;
  font-size:11px;
  margin-top:3px;
}

/* =========================
   GAME AREA
========================= */

.game{
  position:relative;
  width:100%;
  height:65vh;
  min-height:480px;
  max-height:720px;
  overflow:hidden;
  border:2px solid #385270;
  border-radius:28px;
  background:#14243b;
  touch-action:none;
}

/* =========================
   SCENES
========================= */

.scene{
  position:absolute;
  inset:0;
  display:none;
}

.scene.active{
  display:block;
}

/* kitchen */

.kitchen{
  background:
    linear-gradient(
      #dcecff 0 43%,
      #c9d9e7 43% 46%,
      #9daab8 46% 100%
    );
}

/* bathroom */

.bath{
  background:
    linear-gradient(
      #d9f0ff 0 52%,
      #b8cad6 52% 56%,
      #7d8d99 56% 100%
    );
}

/* air conditioner */

.aircon{
  background:
    linear-gradient(
      #e9f5ff 0 55%,
      #d1d8de 55% 59%,
      #9aa6ad 59% 100%
    );
}

/* room */

.room{
  background:
    linear-gradient(
      #f3e9d5 0 58%,
      #b38c66 58% 100%
    );
}

/* =========================
   FURNITURE
========================= */

.furniture{
  position:absolute;
  pointer-events:none;
}

.cab{
  left:8%;
  bottom:16%;
  width:84%;
  height:26%;
  background:#b77a43;
  border:7px solid #81532e;
  border-radius:10px;
}

.sink{
  left:32%;
  bottom:34%;
  width:36%;
  height:13%;
  background:#dce5e9;
  border:5px solid #89979f;
  border-radius:50%;
}

.bathTub{
  left:10%;
  bottom:20%;
  width:80%;
  height:25%;
  background:#f4f7f8;
  border:6px solid #9daeb8;
  border-radius:28px;
}

.airUnit{
  left:12%;
  top:18%;
  width:76%;
  height:18%;
  background:#f8fafc;
  border:5px solid #9ca8b2;
  border-radius:14px;
}

.sofa{
  left:10%;
  bottom:15%;
  width:80%;
  height:28%;
  background:#76645a;
  border-radius:28px 28px 10px 10px;
}

.table{
  left:20%;
  bottom:20%;
  width:60%;
  height:8%;
  background:#805b3e;
  border-radius:8px;
}

/* =========================
   DIRT
========================= */

.dirt{
  position:absolute;
  width:44px;
  height:44px;
  border-radius:50%;
  z-index:30;
  touch-action:manipulation;
  user-select:none;
  transition:
    transform .12s ease,
    opacity .12s ease;
}

.dirt:active{
  transform:scale(.82);
}

.dirt.normal{
  background:
    radial-gradient(
      circle at 30% 30%,
      #725c47 0 10%,
      transparent 11%
    ),
    radial-gradient(
      circle at 65% 55%,
      #47382d 0 18%,
      transparent 19%
    ),
    radial-gradient(
      circle at 45% 75%,
      #5d4736 0 13%,
      transparent 14%
    ),
    #382d26;

  box-shadow:
    0 3px 9px rgba(0,0,0,.4);
}

.dirt.hard{
  width:52px;
  height:52px;

  background:
    radial-gradient(
      circle at 30% 25%,
      #ff6b35 0 10%,
      transparent 11%
    ),
    radial-gradient(
      circle at 65% 60%,
      #7b211b 0 22%,
      transparent 23%
    ),
    #4b1715;

  border:3px solid #ff7043;

  box-shadow:
    0 0 12px rgba(255,80,40,.45);
}

.dirt.rare{
  width:42px;
  height:42px;

  background:
    radial-gradient(
      circle,
      #7df9ff 0 15%,
      #3e8fff 16% 38%,
      #142b67 39% 100%
    );

  border:3px solid #9eeaff;

  box-shadow:
    0 0 18px rgba(80,210,255,.9);
}

.dirt.gold{
  width:50px;
  height:50px;

  background:
    radial-gradient(
      circle,
      #fff4a3 0 15%,
      #ffc857 16% 42%,
      #bd7100 43% 100%
    );

  border:3px solid #ffe27a;

  box-shadow:
    0 0 22px rgba(255,200,50,.95);
}

.dirt.gone{
  opacity:0;
  transform:scale(1.8);
  pointer-events:none;
}

/* =========================
   START CARD
========================= */

.startCard{
  position:absolute;
  inset:9%;
  z-index:100;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:#162a46;
  border:2px solid #405d80;
  border-radius:28px;

  padding:25px;
}

.characters{
  font-size:65px;
}

.startCard h2{
  font-size:30px;
  margin:8px 0;
}

.startCard p{
  color:#dbe5f5;
  font-weight:800;
  line-height:1.7;
}

.mainBtn{
  border:0;
  border-radius:18px;
  padding:17px 35px;
  margin-top:12px;

  background:#50d99a;
  color:#062316;

  font-size:21px;
  font-weight:900;
}

/* =========================
   STAGE MESSAGE
========================= */

.stageMessage{
  position:absolute;
  inset:0;
  z-index:200;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(8,17,31,.75);
}

.stageMessage.show{
  display:flex;
}

.stageBox{
  width:86%;
  background:#162a46;
  border:2px solid #4d6b91;
  border-radius:25px;
  padding:30px;
  text-align:center;
}

.stageBox h2{
  font-size:31px;
  margin:0 0 12px;
}

.stageBox p{
  font-size:19px;
  font-weight:800;
}

/* =========================
   FLOAT SCORE
========================= */

.floatScore{
  position:absolute;
  z-index:300;

  font-size:22px;
  font-weight:900;

  pointer-events:none;

  animation:
    floatUp .7s ease forwards;
}

@keyframes floatUp{

  0%{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  100%{
    opacity:0;
    transform:translateY(-60px) scale(1.3);
  }

}

/* =========================
   RESULT
========================= */

.result{
  position:fixed;
  inset:0;
  z-index:9999;

  display:none;

  background:#08111f;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;

  touch-action:pan-y;
}

.result.show{
  display:block;
}

.resultInner{
  width:100%;
  max-width:720px;
  min-height:100vh;

  margin:auto;

  padding:
    25px
    14px
    70px;
}

.resultTitle{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:20px;
}

.resultPanel{
  background:#162a46;
  border:2px solid #405d80;
  border-radius:26px;

  padding:28px 18px;

  text-align:center;
}

.crown{
  font-size:25px;
  font-weight:900;
}

.finalScore{
  color:#ffc857;
  font-size:62px;
  font-weight:900;
  line-height:1.1;

  margin:12px 0;
}

.bestText{
  color:#dbe5f5;
  font-size:19px;
  font-weight:900;
  line-height:1.7;
}

/* =========================
   CHALLENGE
========================= */

.challenge{
  margin-top:25px;
  padding:22px 15px;

  background:#0d1b30;

  border-radius:22px;
}

.challenge h3{
  font-size:20px;
  margin:0 0 15px;
}

.challenge input{
  width:100%;

  border:0;
  outline:none;

  border-radius:18px;

  padding:18px;

  font-size:20px;
  text-align:center;

  margin-bottom:12px;
}

.challenge button{
  border:0;

  background:#50d99a;
  color:#062316;

  border-radius:16px;

  padding:15px 30px;

  font-size:18px;
  font-weight:900;
}

.judge{
  min-height:38px;

  margin-top:17px;

  font-size:25px;
  font-weight:900;
}

/* =========================
   RANKING
========================= */

.ranking{
  margin-top:25px;

  background:#0d1b30;

  border-radius:22px;

  padding:20px 15px;
}

.ranking h3{
  margin:0 0 15px;

  font-size:20px;
}

.rankRow{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:11px 5px;

  border-bottom:1px solid #263b58;

  font-weight:800;
}

.rankRow:last-child{
  border-bottom:0;
}

/* =========================
   RESULT BUTTONS
========================= */

.resultButtons{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-top:20px;
}

.resultButtons button{
  border:0;
  border-radius:18px;

  padding:17px 8px;

  font-size:17px;
  font-weight:900;
}

.restart{
  background:#50d99a;
  color:#062316;
}

.share{
  background:#344b6b;
  color:#fff;
}

.footer{
  text-align:center;

  color:#65738a;

  margin-top:30px;

  font-size:13px;
  font-weight:800;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  h1{
    font-size:22px;
  }

  .sub{
    font-size:13px;
  }

  .hud{
    gap:5px;
  }

  .hudBox{
    border-radius:15px;
    padding:9px 2px;
  }

  .hudNum{
    font-size:21px;
  }

  .hudLabel{
    font-size:9px;
  }

  .game{
    height:64vh;
    min-height:470px;
  }

  .finalScore{
    font-size:52px;
  }

  .resultTitle{
    font-size:27px;
  }

}

</style>
</head>


<body>


<div class="wrap">

<h1>
🧹 美装職人！クリーンマスター
</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！ランキング＆挑戦状🔥
</div>


<!-- HUD -->

<div class="hud">

<div class="hudBox">
<div id="stageHUD" class="hudNum">1</div>
<div class="hudLabel">ステージ</div>
</div>

<div class="hudBox">
<div id="timeHUD" class="hudNum">30</div>
<div class="hudLabel">残り秒数</div>
</div>

<div class="hudBox">
<div id="scoreHUD" class="hudNum">0</div>
<div class="hudLabel">スコア</div>
</div>

<div class="hudBox">
<div id="comboHUD" class="hudNum">0🔥</div>
<div class="hudLabel">コンボ</div>
</div>

</div>


<!-- GAME -->

<div id="game" class="game">


<!-- STAGE 1 -->

<div id="scene1" class="scene kitchen active">

<div class="cab furniture"></div>
<div class="sink furniture"></div>

</div>


<!-- STAGE 2 -->

<div id="scene2" class="scene bath">

<div class="bathTub furniture"></div>

</div>


<!-- STAGE 3 -->

<div id="scene3" class="scene aircon">

<div class="airUnit furniture"></div>

</div>


<!-- STAGE 4 -->

<div id="scene4" class="scene room">

<div class="sofa furniture"></div>
<div class="table furniture"></div>

</div>


<!-- START -->

<div id="startCard" class="startCard">

<div class="characters">
🐉 🐶
</div>

<h2>
美装職人！Ver.FINAL
</h2>

<p>
汚れをタップして落とせ！<br>
コンボをつなげて高得点を狙え！<br>
4ステージを制覇して<br>
友達のスコアにも挑戦しよう🔥
</p>

<button
id="startBtn"
class="mainBtn"
>
現場へ出発！
</button>

</div>


<!-- STAGE MESSAGE -->

<div
id="stageMessage"
class="stageMessage"
>

<div class="stageBox">

<h2 id="stageMessageTitle">
🔥 STAGE CLEAR!
</h2>

<p id="stageMessageText"></p>

</div>

</div>


</div>

</div>



<!-- RESULT -->

<div
id="result"
class="result"
>

<div class="resultInner">


<div class="resultTitle">
🏆 全ステージ制覇！
</div>


<div class="resultPanel">


<div class="crown">
👑 伝説の美装職人
</div>


<div
id="finalScore"
class="finalScore"
>
0点
</div>


<div
id="bestText"
class="bestText"
>
🏆 ハイスコア：0点
</div>


<!-- FRIEND -->

<div class="challenge">

<h3>
⚔️ 友達のスコアに挑戦
</h3>

<input
id="friendScore"
type="number"
inputmode="numeric"
placeholder="友達のスコアを入力"
>

<button id="judgeBtn">
勝負判定！
</button>

<div
id="judgeResult"
class="judge"
></div>

</div>


<!-- RANKING -->

<div class="ranking">

<h3>
🏆 あなたのランキング
</h3>

<div id="rankingList"></div>

</div>


<!-- BUTTONS -->

<div class="resultButtons">

<button
id="restartBtn"
class="restart"
>
もう一度！
</button>

<button
id="shareBtn"
class="share"
>
𝕏 挑戦状をシェア
</button>

</div>


</div>


<div class="footer">
美装職人！クリーンマスター
</div>


</div>

</div>



<script>

/* ==================================================
   GAME SETTINGS
================================================== */

const TOTAL_STAGES = 4;

const STAGE_TIME = 30;

const MAX_DIRT = 12;


/* ==================================================
   VARIABLES
================================================== */

let stage = 1;

let time = STAGE_TIME;

let score = 0;

let combo = 0;

let remaining = 0;

let playing = false;

let timer = null;

let dirtTimer = null;


/* ==================================================
   DOM
================================================== */

const game =
document.getElementById("game");

const startCard =
document.getElementById("startCard");

const startBtn =
document.getElementById("startBtn");

const stageHUD =
document.getElementById("stageHUD");

const timeHUD =
document.getElementById("timeHUD");

const scoreHUD =
document.getElementById("scoreHUD");

const comboHUD =
document.getElementById("comboHUD");

const stageMessage =
document.getElementById("stageMessage");

const stageMessageTitle =
document.getElementById("stageMessageTitle");

const stageMessageText =
document.getElementById("stageMessageText");

const result =
document.getElementById("result");

const finalScore =
document.getElementById("finalScore");

const bestText =
document.getElementById("bestText");

const friendScore =
document.getElementById("friendScore");

const judgeBtn =
document.getElementById("judgeBtn");

const judgeResult =
document.getElementById("judgeResult");

const restartBtn =
document.getElementById("restartBtn");

const shareBtn =
document.getElementById("shareBtn");

const rankingList =
document.getElementById("rankingList");


/* ==================================================
   HIGH SCORE
================================================== */

function getHighScore(){

  return Number(
    localStorage.getItem("bisoHighScore")
  ) || 0;

}


function saveHighScore(value){

  localStorage.setItem(
    "bisoHighScore",
    String(value)
  );

}


/* ==================================================
   RANKING
================================================== */

function getRanking(){

  try{

    return JSON.parse(
      localStorage.getItem("bisoRanking")
    ) || [];

  }catch(e){

    return [];

  }

}


function saveRanking(value){

  let ranking =
    getRanking();

  ranking.push(value);

  ranking.sort(
    (a,b)=>b-a
  );

  ranking =
    ranking.slice(0,5);

  localStorage.setItem(
    "bisoRanking",
    JSON.stringify(ranking)
  );

}


function showRanking(){

  const ranking =
    getRanking();

  if(ranking.length === 0){

    rankingList.innerHTML =
      "<div class='rankRow'>まだ記録なし</div>";

    return;

  }

  rankingList.innerHTML =
    ranking
      .map((value,index)=>{

        const medals =
          ["🥇","🥈","🥉","4️⃣","5️⃣"];

        return `
          <div class="rankRow">
            <span>
              ${medals[index] || ""} ${index+1}位
            </span>

            <span>
              ${Number(value).toLocaleString()}点
            </span>
          </div>
        `;

      })
      .join("");

}


/* ==================================================
   HUD
================================================== */

function updateHUD(){

  stageHUD.textContent =
    stage;

  timeHUD.textContent =
    time;

  scoreHUD.textContent =
    score.toLocaleString();

  comboHUD.textContent =
    combo + "🔥";

}


/* ==================================================
   SCENE
================================================== */

function showStage(){

  document
    .querySelectorAll(".scene")
    .forEach(scene=>{
      scene.classList.remove("active");
    });

  const current =
    document.getElementById(
      "scene" + stage
    );

  if(current){

    current.classList.add("active");

  }

}


/* ==================================================
   RANDOM DIRT TYPE
================================================== */

function randomDirtType(){

  const random =
    Math.random();

  if(random < 0.08){

    return "gold";

  }

  if(random < 0.20){

    return "rare";

  }

  if(random < 0.40){

    return "hard";

  }

  return "normal";

}


/* ==================================================
   DIRT POINT
================================================== */

function dirtPoint(type){

  if(type === "gold"){
    return 1500;
  }

  if(type === "rare"){
    return 700;
  }

  if(type === "hard"){
    return 350;
  }

  return 150;

}


/* ==================================================
   CREATE DIRT
================================================== */

function createDirt(){

  if(!playing){
    return;
  }

  if(remaining >= MAX_DIRT){
    return;
  }

  const dirt =
    document.createElement("div");

  const type =
    randomDirtType();

  dirt.className =
    "dirt " + type;

  const x =
    7 + Math.random() * 84;

  const y =
    17 + Math.random() * 67;

  dirt.style.left =
    x + "%";

  dirt.style.top =
    y + "%";

  dirt.dataset.type =
    type;

  dirt.addEventListener(
    "pointerdown",
    cleanDirt,
    {passive:false}
  );

  game.appendChild(dirt);

  remaining++;

  /* 自動消滅 */

  setTimeout(()=>{

    if(
      dirt.parentNode &&
      !dirt.classList.contains("gone")
    ){

      dirt.remove();

      remaining =
        Math.max(
          0,
          remaining - 1
        );

    }

  },5500);

}


/* ==================================================
   FLOAT SCORE
================================================== */

function showFloatScore(
  dirt,
  points
){

  const float =
    document.createElement("div");

  float.className =
    "floatScore";

  float.textContent =
    "+" +
    points.toLocaleString();

  float.style.left =
    dirt.style.left;

  float.style.top =
    dirt.style.top;

  game.appendChild(float);

  setTimeout(()=>{

    if(float.parentNode){
      float.remove();
    }

  },700);

}


/* ==================================================
   CLEAN DIRT
================================================== */

function cleanDirt(e){

  e.preventDefault();

  if(!playing){
    return;
  }

  const dirt =
    e.currentTarget;

  if(
    dirt.classList.contains("gone")
  ){
    return;
  }

  dirt.classList.add("gone");

  const type =
    dirt.dataset.type;

  let points =
    dirtPoint(type);


  /* コンボ */

  combo++;


  const multiplier =
    Math.min(
      3,
      1 + combo * 0.1
    );


  points =
    Math.round(
      points * multiplier
    );


  score += points;


  showFloatScore(
    dirt,
    points
  );


  remaining =
    Math.max(
      0,
      remaining - 1
    );


  updateHUD();


  setTimeout(()=>{

    if(dirt.parentNode){
      dirt.remove();
    }

  },130);

}


/* ==================================================
   CLEAR DIRT
================================================== */

function clearDirt(){

  document
    .querySelectorAll(".dirt")
    .forEach(dirt=>{
      dirt.remove();
    });

  document
    .querySelectorAll(".floatScore")
    .forEach(item=>{
      item.remove();
    });

  remaining = 0;

}


/* ==================================================
   START GAME
================================================== */

function startGame(){

  clearInterval(timer);

  clearInterval(dirtTimer);

  stage = 1;

  time = STAGE_TIME;

  score = 0;

  combo = 0;

  remaining = 0;

  playing = true;

  result.classList.remove("show");

  startCard.style.display =
    "none";

  stageMessage.classList.remove(
    "show"
  );

  clearDirt();

  showStage();

  updateHUD();


  /* 最初の汚れ */

  for(let i=0;i<7;i++){

    createDirt();

  }


  /* 汚れ追加 */

  dirtTimer =
    setInterval(()=>{

      if(
        playing &&
        remaining < MAX_DIRT
      ){

        createDirt();

      }

    },650);


  startTimer();

}


/* ==================================================
   TIMER
================================================== */

function startTimer(){

  clearInterval(timer);

  timer =
    setInterval(()=>{

      if(!playing){
        return;
      }

      time--;

      /*
        時間が減るとコンボリセット
        ただしスコアはそのまま
      */

      if(time <= 0){

        time = 0;

        updateHUD();

        clearInterval(timer);

        endStage();

        return;

      }

      updateHUD();

    },1000);

}


/* ==================================================
   END STAGE
================================================== */

function endStage(){

  if(!playing){
    return;
  }

  clearInterval(timer);

  clearDirt();


  /*
    ステージクリアボーナス
  */

  const bonus =
    500 +
    stage * 250 +
    time * 50;


  score += bonus;


  updateHUD();


  if(stage < TOTAL_STAGES){

    stageMessageTitle.textContent =
      "🔥 STAGE " +
      stage +
      " CLEAR!";


    stageMessageText.innerHTML =
      "ステージボーナス！<br>" +
      "+" +
      bonus.toLocaleString() +
      "点<br><br>" +
      "次の現場へ！";


    stageMessage.classList.add(
      "show"
    );


    setTimeout(()=>{

      stageMessage.classList.remove(
        "show"
      );

      stage++;

      time =
        STAGE_TIME;

      combo = 0;

      showStage();

      updateHUD();

      for(
        let i=0;
        i<7;
        i++
      ){

        createDirt();

      }

      startTimer();

    },1400);


  }else{

    finishGame();

  }

}


/* ==================================================
   FINISH GAME
================================================== */

function finishGame(){

  playing = false;

  clearInterval(timer);

  clearInterval(dirtTimer);

  clearDirt();


  /* 最終ボーナス */

  const finalBonus =
    1000 +
    combo * 100;


  score += finalBonus;


  const oldBest =
    getHighScore();


  const newBest =
    score > oldBest;


  if(newBest){

    saveHighScore(score);

  }


  saveRanking(score);


  const high =
    Math.max(
      score,
      getHighScore()
    );


  finalScore.textContent =
    score.toLocaleString() +
    "点";


  if(newBest){

    bestText.innerHTML =
      "🔥 自己ベスト更新！<br>" +
      "🏆 ハイスコア：" +
      high.toLocaleString() +
      "点";

  }else{

    bestText.innerHTML =
      "🏆 ハイスコア：" +
      high.toLocaleString() +
      "点<br>" +
      "🔥 もっと上を狙おう！";

  }


  friendScore.value =
    "";

  judgeResult.textContent =
    "";


  showRanking();


  result.classList.add(
    "show"
  );


  /* 結果画面の一番上 */

  result.scrollTop = 0;

}


/* ==================================================
   FRIEND BATTLE
================================================== */

function judgeFriend(){

  const friend =
    Number(
      friendScore.value
    );


  if(
    !Number.isFinite(friend) ||
    friend < 0
  ){

    judgeResult.textContent =
      "友達のスコアを入力してな！";

    return;

  }


  if(score > friend){

    judgeResult.textContent =
      "🔥 俺の勝ち！";


  }else if(score < friend){

    judgeResult.textContent =
      "😱 友達の勝ち！";


  }else{

    judgeResult.textContent =
      "🤝 引き分け！";

  }

}


/* ==================================================
   RESTART
================================================== */

function restartGame(){

  result.classList.remove(
    "show"
  );

  startGame();

}


/* ==================================================
   SHARE
================================================== */

function shareChallenge(){

  const text =
`🧹 美装職人！クリーンマスター

👑 俺のスコア：
${score.toLocaleString()}点

🔥 このスコア超えられる？

👉 俺より高得点出してみて！

#美装 #掃除 #ゲーム`;


  const url =
    location.href;


  const shareUrl =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text) +
    "&url=" +
    encodeURIComponent(url);


  window.open(
    shareUrl,
    "_blank"
  );

}

          stage:TOTAL_STAGES,

        })
      }

      "ランキング保存エラー",

    );

};

showRanking = async function(){

  try{

    const response =
      await fetch(
        SB_URL +
        "/rest/v1/leaderboard" +
        "?select=player_name,score" +
        "&order=score.desc" +
        "&limit=5",
        {
          headers:{

          }

    const ranking =
      await response.json();

      rankingList.innerHTML =
        "<div class='rankRow'>まだ記録なし</div>";

      return;
    }

    const medals =
      [
  "🥇",
  "🥈",
  "🥉",
  "4️⃣",
  "5️⃣"
];
const bestByName = new Map();

ranking.forEach(item => {
  const name = String(item.player_name).replace(/\s+/g, "").trim();
  const score = Number(item.score);

  if (!bestByName.has(name) || score > bestByName.get(name).score) {
    bestByName.set(name, {
      player_name: name,
      score: score
    });
  }
});

const bestRanking = Array.from(bestByName.values())
  .sort((a, b) => b.score - a.score)
  .slice(0, 5);
    rankingList.innerHTML =
      bestRanking.map((item,index)=>`

        <div class="rankRow">

          <span>
            ${medals[index]}
            ${index+1}位
            ${item.player_name}
          </span>

          <span>
            ${Number(item.score).toLocaleString()}点
          </span>

        </div>

      `).join("");

  }catch(error){

    console.error(
      "ランキング取得エラー",
      error
    );

  }

};

showRanking();
