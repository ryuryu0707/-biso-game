<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>美装職人！クリーンマスター</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#071222;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  border:0;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:clamp(25px,6vw,45px);
  margin:5px 0;
  font-weight:900;
}

.sub{
  text-align:center;
  color:#dce8f8;
  font-size:clamp(14px,3.8vw,22px);
  font-weight:800;
  margin-bottom:14px;
}

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}

.hudbox{
  background:#172d4b;
  border-radius:16px;
  padding:10px 3px;
  text-align:center;
}

.num{
  font-size:clamp(22px,6vw,39px);
  font-weight:900;
  line-height:1.05;
}

.lab{
  font-size:clamp(10px,2.7vw,16px);
  color:#dce8f8;
  font-weight:700;
  margin-top:5px;
}

.message{
  height:28px;
  text-align:center;
  font-size:18px;
  font-weight:900;
}

.good{
  color:#55e6a0;
}

.bad{
  color:#ff7777;
}

.game{
  position:relative;
  width:100%;
  height:min(72vh,700px);
  min-height:520px;
  overflow:hidden;
  border:5px solid #42678e;
  border-radius:28px;
  touch-action:manipulation;
  box-shadow:0 12px 35px rgba(0,0,0,.3);
}

/* 5種類の背景 */

.kitchen{
  background:
  linear-gradient(135deg,#fff0c9 0 47%,#d7ba83 47% 100%);
}

.bath{
  background:
  linear-gradient(135deg,#dff9ff,#83cbe1);
}

.window{
  background:
  linear-gradient(180deg,#75c9f6 0 45%,#d6f2ff 45% 100%);
}

.room{
  background:
  linear-gradient(135deg,#f5e2cb,#c79669);
}

.floor{
  background:
  linear-gradient(135deg,#d9c5a5,#8c6b49);
}

.scene{
  position:absolute;
  top:14px;
  left:18px;
  color:rgba(30,40,50,.45);
  font-size:clamp(18px,5vw,30px);
  font-weight:900;
  pointer-events:none;
  z-index:2;
}

.dirt{
  position:absolute;
  width:58px;
  height:42px;
  border-radius:50%;
  background:#70401f;
  box-shadow:
    inset 0 -5px 0 rgba(0,0,0,.14),
    0 8px 13px rgba(0,0,0,.25);
  transform:translate(-50%,-50%) rotate(var(--rot));
  z-index:10;
  animation:pop .15s ease-out;
}

.dirt::after{
  content:"";
  position:absolute;
  width:44%;
  height:40%;
  left:28%;
  top:20%;
  border-radius:50%;
  background:#966e51;
}

.yellow{
  background:#b98305;
}

.yellow::after{
  background:#ffd84d;
}

.blue{
  background:#3c6177;
  border:4px solid #9beaff;
  box-shadow:0 0 18px rgba(80,210,255,.65);
}

.blue::after{
  background:#68899b;
}

.green{
  background:#345b2d;
  border:3px solid #7bd05e;
}

.green::after{
  background:#54884b;
}

@keyframes pop{
  from{
    transform:translate(-50%,-50%) scale(.2) rotate(var(--rot));
    opacity:0;
  }
  to{
    transform:translate(-50%,-50%) scale(1) rotate(var(--rot));
    opacity:1;
  }
}

.removing{
  animation:remove .12s forwards;
}

@keyframes remove{
  0%{
    transform:translate(-50%,-50%) scale(1);
  }
  50%{
    transform:translate(-50%,-50%) scale(1.35);
  }
  100%{
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
  }
}

.flash{
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
  opacity:0;
}

.flashGood{
  background:rgba(50,255,150,.12);
  animation:flash .18s;
}

.flashBad{
  background:rgba(255,40,40,.25);
  animation:flash .25s;
}

@keyframes flash{
  from{opacity:1}
  to{opacity:0}
}

/* オーバーレイ */

.overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(3,13,27,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.panel{
  width:min(720px,100%);
  background:#1b395c;
  border:5px solid #47739e;
  border-radius:30px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.panel h2{
  margin:5px 0 15px;
  font-size:clamp(34px,9vw,60px);
}

.panel p{
  color:#dbe8f7;
  font-size:clamp(15px,4vw,21px);
  font-weight:700;
  line-height:1.7;
}

.startButton{
  width:min(450px,100%);
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#4bd99a;
  color:#062319;
  font-size:clamp(21px,5vw,29px);
  font-weight:900;
}

.startButton:active{
  transform:scale(.97);
}

.finalScore{
  color:#ffc84d;
  font-size:clamp(50px,14vw,90px);
  font-weight:900;
  margin:12px 0;
}

.rank{
  margin-top:20px;
  padding:16px;
  background:#0b1e37;
  border-radius:20px;
  text-align:left;
}

.rankTitle{
  text-align:center;
  font-size:23px;
  font-weight:900;
  margin-bottom:10px;
}

.rankRow{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:10px 4px;
  border-bottom:1px solid #2b4561;
  font-weight:800;
}

.rankRow:last-child{
  border-bottom:0;
}

.hidden{
  display:none !important;
}

@media(max-width:600px){

  .wrap{
    padding:9px;
  }

  .hud{
    gap:6px;
  }

  .hudbox{
    border-radius:13px;
    padding:9px 2px;
  }

  .game{
    min-height:560px;
    height:70vh;
    border-width:4px;
    border-radius:22px;
  }

  .dirt{
    width:54px;
    height:39px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">

<div class="hudbox">
<div class="num" id="stage">1</div>
<div class="lab">ステージ</div>
</div>

<div class="hudbox">
<div class="num" id="time">25</div>
<div class="lab">残り時間</div>
</div>

<div class="hudbox">
<div class="num" id="score">0</div>
<div class="lab">スコア</div>
</div>

<div class="hudbox">
<div class="num" id="combo">0</div>
<div class="lab">コンボ</div>
</div>

</div>

<div class="message" id="message"></div>

<div class="game kitchen" id="game">

<div class="scene" id="scene">
🍳 KITCHEN
</div>

<div class="flash" id="flash"></div>

</div>

</div>


<!-- スタート -->

<div class="overlay" id="start">

<div class="panel">

<div style="font-size:70px">🧹</div>

<h2>クリーンマスター</h2>

<p>
画面の汚れをタップして掃除しよう！<br>
正解すると得点＆コンボアップ🔥<br>
空白をタップすると<strong style="color:#ff7777">−500点</strong>！
</p>

<p>
全5ステージを制限時間いっぱい攻略！
</p>

<button class="startButton" id="startBtn">
▶ スタート
</button>

</div>

</div>


<!-- 結果 -->

<div class="overlay hidden" id="result">

<div class="panel">

<div style="font-size:65px">🏆</div>

<h2>ゲーム終了！</h2>

<div>あなたのスコア</div>

<div class="finalScore" id="finalScore">
0点
</div>

<div id="ranking"></div>

<button class="startButton" id="againBtn">
もう一度！
</button>

</div>

</div>


<script>

"use strict";

/* =========================
   ステージ設定
========================= */

const stages = [

{
name:"🍳 KITCHEN",
className:"kitchen",
time:25,
count:24
},

{
name:"🛁 BATH",
className:"bath",
time:23,
count:27
},

{
name:"🪟 WINDOW",
className:"window",
time:22,
count:30
},

{
name:"🛋️ ROOM",
className:"room",
time:21,
count:34
},

{
name:"🧹 FLOOR",
className:"floor",
time:20,
count:38
}

];


/* =========================
   状態
========================= */

let currentStage=1;
let timeLeft=25;
let score=0;
let combo=0;

let playing=false;

let timer=null;
let refillTimer=null;

let dirtCount=0;


/* =========================
   DOM
========================= */

const game=document.getElementById("game");

const stageEl=document.getElementById("stage");
const timeEl=document.getElementById("time");
const scoreEl=document.getElementById("score");
const comboEl=document.getElementById("combo");

const sceneEl=document.getElementById("scene");
const messageEl=document.getElementById("message");

const flash=document.getElementById("flash");

const startOverlay=document.getElementById("start");
const resultOverlay=document.getElementById("result");

const startBtn=document.getElementById("startBtn");
const againBtn=document.getElementById("againBtn");

const finalScore=document.getElementById("finalScore");
const rankingEl=document.getElementById("ranking");


/* =========================
   HUD
========================= */

function updateHUD(){

stageEl.textContent=currentStage;

timeEl.textContent=timeLeft;

scoreEl.textContent=Math.max(0,score).toLocaleString();

comboEl.textContent=combo;

}


/* =========================
   メッセージ
========================= */

function message(text,type){

messageEl.textContent=text;

messageEl.className="message "+type;

setTimeout(()=>{

if(messageEl.textContent===text){

messageEl.textContent="";

}

},650);

}


/* =========================
   背景変更
========================= */

function changeBackground(){

const data=stages[currentStage-1];

game.className="game "+data.className;

sceneEl.textContent=data.name;

}


/* =========================
   汚れ削除
========================= */

function removeAllDirt(){

document.querySelectorAll(".dirt").forEach(el=>el.remove());

dirtCount=0;

}


/* =========================
   ランダム位置
========================= */

function position(){

return {

x:6+Math.random()*88,

y:9+Math.random()*85

};

}


/* =========================
   汚れ生成
========================= */

function addDirt(number){

for(let i=0;i<number;i++){

const dirt=document.createElement("div");

let type=Math.random();

if(type<0.15){

dirt.className="dirt blue";

}else if(type<0.28){

dirt.className="dirt yellow";

}else if(type<0.38){

dirt.className="dirt green";

}else{

dirt.className="dirt";

}

const p=position();

dirt.style.left=p.x+"%";

dirt.style.top=p.y+"%";

dirt.style.setProperty(
"--rot",
(-20+Math.random()*40)+"deg"
);


/*
  汚れを押した場合
*/

dirt.addEventListener("pointerdown",function(e){

e.preventDefault();

e.stopPropagation();

if(!playing)return;

clean(dirt);

});


game.appendChild(dirt);

dirtCount++;

}

}


/* =========================
   掃除成功
========================= */

function clean(dirt){

if(!dirt || !dirt.isConnected)return;


/*
  コンボ
*/

combo++;


/*
  コンボボーナス
*/

let points=300+(combo*50);

if(points>1300){

points=1300;

}

score+=points;

dirtCount--;


/*
  アニメーション
*/

dirt.classList.add("removing");

flash.className="flash flashGood";


setTimeout(()=>{

if(dirt.isConnected){

dirt.remove();

}

},120);


message("✨ +"+points+"点","good");


updateHUD();


/*
  汚れが減ったら即補充
  ただしステージは絶対に変えない
*/

if(dirtCount<8){

setTimeout(()=>{

if(playing && timeLeft>0){

addDirt(10+currentStage*3);

}

},180);

}

}


/* =========================
   空白タップ＝ミス
========================= */

game.addEventListener("pointerdown",function(){

if(!playing)return;


/*
  汚れ以外を押した
*/

combo=0;

score-=500;

if(score<0){

score=0;

}

flash.className="flash flashBad";

message("❌ ミス！ −500点","bad");

updateHUD();

});


/* =========================
   ステージ開始
========================= */

function beginStage(){

removeAllDirt();

changeBackground();

const data=stages[currentStage-1];

timeLeft=data.time;


/*
  最初から大量配置
*/

addDirt(data.count);

updateHUD();

message(
"🔥 STAGE "+currentStage+" START!",
"good"
);


/*
  一定間隔で汚れ補充
*/

clearInterval(refillTimer);

refillTimer=setInterval(()=>{

if(!playing)return;

if(timeLeft<=0)return;


/*
  画面に残っている汚れが少ない時だけ追加
*/

if(dirtCount<12){

addDirt(10+currentStage*3);

}

},900);

}


/* =========================
   タイマー
========================= */

function startTimer(){

clearInterval(timer);

timer=setInterval(()=>{

if(!playing)return;

timeLeft--;

if(timeLeft<0){

timeLeft=0;

}

updateHUD();


/*
  0秒になったらステージ終了
*/

if(timeLeft===0){

clearInterval(timer);

clearInterval(refillTimer);


/*
  すぐには切り替えず少しだけ待つ
*/

setTimeout(()=>{

nextStage();

},500);

}

},1000);

}


/* =========================
   次ステージ
========================= */

function nextStage(){

if(!playing)return;

if(currentStage>=5){

finish();

return;

}

currentStage++;

beginStage();

startTimer();

}


/* =========================
   ゲーム開始
========================= */

function startGame(){

clearInterval(timer);

clearInterval(refillTimer);

currentStage=1;

score=0;

combo=0;

playing=true;

startOverlay.classList.add("hidden");

resultOverlay.classList.add("hidden");

beginStage();

startTimer();

updateHUD();

}


/* =========================
   ランキング取得
========================= */

function getRanking(){

try{

const data=JSON.parse(
localStorage.getItem("cleanMasterRanking")||"[]"
);

if(Array.isArray(data)){

return data;

}

}catch(e){}

return [];

}


/* =========================
   ランキング保存
========================= */

function saveScore(){

const ranking=getRanking();


ranking.push({

name:"リュウタ",

score:Math.max(0,score),

date:new Date().toLocaleDateString("ja-JP")

});


ranking.sort((a,b)=>b.score-a.score);

const top=ranking.slice(0,10);


try{

localStorage.setItem(
"cleanMasterRanking",
JSON.stringify(top)
);

}catch(e){}


return top;

}


/* =========================
   ランキング表示
========================= */

function showRanking(list){

let html=`

<div class="rank">

<div class="rankTitle">
🏆 あなたのランキング
</div>

`;


list.forEach((item,index)=>{

let medal="";

if(index===0){

medal="🥇";

}else if(index===1){

medal="🥈";

}else if(index===2){

medal="🥉";

}else{

medal=(index+1)+"位";

}


html+=`

<div class="rankRow">

<span>${medal} ${item.name}</span>

<span>${Number(item.score).toLocaleString()}点</span>

</div>

`;

});


html+=`</div>`;


rankingEl.innerHTML=html;

}


/* =========================
   終了
========================= */

function finish(){

playing=false;

clearInterval(timer);

clearInterval(refillTimer);

removeAllDirt();


finalScore.textContent=
Math.max(0,score).toLocaleString()+"点";


const ranking=saveScore();

showRanking(ranking);


resultOverlay.classList.remove("hidden");

}


/* =========================
   ボタン
========================= */

startBtn.addEventListener("click",function(){

startGame();

});


againBtn.addEventListener("click",function(){

startGame();

});


/* =========================
   初期化
========================= */

function init(){

playing=false;

clearInterval(timer);

clearInterval(refillTimer);

currentStage=1;

timeLeft=stages[0].time;

score=0;

combo=0;

removeAllDirt();

changeBackground();

updateHUD();

startOverlay.classList.remove("hidden");

resultOverlay.classList.add("hidden");

}


init();

</script>

</body>
</html>
