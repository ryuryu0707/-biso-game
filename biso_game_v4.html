<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>美装職人！クリーンマスター</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#08111f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:25px;
  margin:6px 0 2px;
}

.sub{
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:#dbe5f5;
  margin-bottom:12px;
}

/* HUD */

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}

.hudBox{
  background:#162a46;
  border-radius:18px;
  padding:10px 4px;
  text-align:center;
}

.hudNum{
  font-size:25px;
  font-weight:900;
}

.hudLabel{
  font-size:11px;
  color:#b8c7dc;
  margin-top:3px;
}

/* GAME */

.game{
  position:relative;
  width:100%;
  height:62vh;
  min-height:480px;
  max-height:720px;
  overflow:hidden;
  border:2px solid #304867;
  border-radius:28px;
  background:#14243b;
  touch-action:none;
}

.scene{
  position:absolute;
  inset:0;
  display:none;
}

.scene.active{
  display:block;
}

/* backgrounds */

.scene.kitchen{
  background:
    linear-gradient(
      #dcecff 0 43%,
      #c9d9e7 43% 46%,
      #9daab8 46% 100%
    );
}

.scene.bath{
  background:
    linear-gradient(
      #d9f0ff 0 52%,
      #b8cad6 52% 56%,
      #7d8d99 56% 100%
    );
}

.scene.aircon{
  background:
    linear-gradient(
      #e9f5ff 0 55%,
      #d1d8de 55% 59%,
      #9aa6ad 59% 100%
    );
}

.scene.room{
  background:
    linear-gradient(
      #f3e9d5 0 58%,
      #b38c66 58% 100%
    );
}

/* simple furniture */

.furniture{
  position:absolute;
  user-select:none;
  pointer-events:none;
}

.cab{
  left:8%;
  bottom:16%;
  width:84%;
  height:26%;
  background:#b77a43;
  border:7px solid #81532e;
  border-radius:10px;
}

.sink{
  left:32%;
  bottom:34%;
  width:36%;
  height:13%;
  background:#dce5e9;
  border-radius:50%;
  border:5px solid #89979f;
}

.bathTub{
  left:10%;
  bottom:20%;
  width:80%;
  height:25%;
  background:#f4f7f8;
  border:6px solid #9daeb8;
  border-radius:28px;
}

.airUnit{
  left:12%;
  top:18%;
  width:76%;
  height:18%;
  background:#f8fafc;
  border:5px solid #9ca8b2;
  border-radius:14px;
}

.sofa{
  left:10%;
  bottom:15%;
  width:80%;
  height:28%;
  background:#76645a;
  border-radius:28px 28px 10px 10px;
}

.table{
  left:20%;
  bottom:20%;
  width:60%;
  height:8%;
  background:#805b3e;
  border-radius:8px;
}

/* dirt */

.dirt{
  position:absolute;
  width:46px;
  height:46px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,#665341 0 10%,transparent 11%),
    radial-gradient(circle at 65% 55%,#47382d 0 18%,transparent 19%),
    radial-gradient(circle at 45% 75%,#5d4736 0 13%,transparent 14%),
    #382d26;
  box-shadow:0 3px 8px rgba(0,0,0,.35);
  cursor:pointer;
  touch-action:manipulation;
  transition:.15s ease;
  z-index:20;
}

.dirt.small{
  width:30px;
  height:30px;
}

.dirt.gone{
  transform:scale(1.5);
  opacity:0;
  pointer-events:none;
}

/* start */

.startCard{
  position:absolute;
  inset:10%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#162a46;
  border:2px solid #3c5879;
  border-radius:28px;
  padding:25px;
  z-index:50;
}

.characters{
  font-size:65px;
  margin-bottom:10px;
}

.startCard h2{
  font-size:30px;
  margin:8px 0;
}

.startCard p{
  color:#dbe5f5;
  line-height:1.7;
  font-weight:700;
}

.mainBtn{
  border:0;
  background:#50d99a;
  color:#062316;
  font-size:21px;
  font-weight:900;
  border-radius:18px;
  padding:17px 35px;
  margin-top:15px;
  cursor:pointer;
}

/* stage message */

.stageMessage{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(8,17,31,.72);
}

.stageMessage.show{
  display:flex;
}

.stageBox{
  background:#162a46;
  border:2px solid #4b678c;
  border-radius:25px;
  padding:30px;
  width:85%;
  text-align:center;
}

.stageBox h2{
  font-size:32px;
  margin:0 0 12px;
}

/* result */

.result{
  position:fixed;
  inset:0;
  z-index:999;
  display:none;
  background:#08111f;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}

.result.show{
  display:block;
}

.resultInner{
  width:100%;
  max-width:720px;
  min-height:100vh;
  margin:0 auto;
  padding:25px 14px 60px;
}

.resultTitle{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin:10px 0 20px;
}

.resultPanel{
  background:#162a46;
  border:2px solid #3c5879;
  border-radius:25px;
  padding:28px 18px;
  text-align:center;
}

.crown{
  font-size:25px;
  font-weight:900;
}

.finalScore{
  font-size:64px;
  color:#ffc857;
  font-weight:900;
  margin:10px 0;
  line-height:1.1;
}

.bestText{
  font-size:20px;
  font-weight:900;
  color:#dbe5f5;
  line-height:1.6;
}

.challenge{
  margin-top:25px;
  padding:22px 15px;
  background:#0d1b30;
  border-radius:22px;
}

.challenge h3{
  margin:0 0 15px;
  font-size:20px;
}

.challenge input{
  width:100%;
  border:0;
  border-radius:18px;
  padding:18px;
  font-size:20px;
  text-align:center;
  outline:none;
  margin-bottom:12px;
}

.challenge button{
  border:0;
  background:#50d99a;
  color:#062316;
  border-radius:16px;
  padding:15px 30px;
  font-size:18px;
  font-weight:900;
}

.judge{
  font-size:25px;
  font-weight:900;
  margin-top:18px;
  min-height:35px;
}

.resultButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.resultButtons button{
  border:0;
  border-radius:18px;
  padding:17px 8px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.restart{
  background:#50d99a;
  color:#062316;
}

.share{
  background:#344b6b;
  color:#fff;
}

.footer{
  text-align:center;
  color:#65738a;
  margin-top:30px;
  font-size:13px;
  font-weight:700;
}

/* mobile */

@media(max-width:480px){

  h1{
    font-size:22px;
  }

  .sub{
    font-size:13px;
  }

  .hud{
    gap:5px;
  }

  .hudBox{
    padding:9px 2px;
    border-radius:15px;
  }

  .hudNum{
    font-size:22px;
  }

  .hudLabel{
    font-size:10px;
  }

  .game{
    height:64vh;
    min-height:470px;
  }

  .finalScore{
    font-size:52px;
  }

  .resultTitle{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>🧹 美装職人！クリーンマスター</h1>

  <div class="sub">
    🐉 龍＆🐶わんこと競争！ランキング＆挑戦状🔥
  </div>

  <div class="hud">

    <div class="hudBox">
      <div id="stageHUD" class="hudNum">1</div>
      <div class="hudLabel">ステージ</div>
    </div>

    <div class="hudBox">
      <div id="timeHUD" class="hudNum">30</div>
      <div class="hudLabel">残り秒数</div>
    </div>

    <div class="hudBox">
      <div id="scoreHUD" class="hudNum">0</div>
      <div class="hudLabel">スコア</div>
    </div>

    <div class="hudBox">
      <div id="comboHUD" class="hudNum">0🔥</div>
      <div class="hudLabel">コンボ</div>
    </div>

  </div>

  <div id="game" class="game">

    <div id="scene1" class="scene kitchen active">
      <div class="cab furniture"></div>
      <div class="sink furniture"></div>
    </div>

    <div id="scene2" class="scene bath">
      <div class="bathTub furniture"></div>
    </div>

    <div id="scene3" class="scene aircon">
      <div class="airUnit furniture"></div>
    </div>

    <div id="scene4" class="scene room">
      <div class="sofa furniture"></div>
      <div class="table furniture"></div>
    </div>

    <div id="startCard" class="startCard">

      <div class="characters">
        🐉 🐶
      </div>

      <h2>美装職人！Ver.5</h2>

      <p>
        汚れをタップして落とせ！<br>
        4ステージを制覇して<br>
        友達のスコアにも挑戦しよう🔥
      </p>

      <button id="startBtn" class="mainBtn">
        現場へ出発！
      </button>

    </div>

    <div id="stageMessage" class="stageMessage">

      <div class="stageBox">

        <h2 id="stageMessageTitle">
          STAGE CLEAR!
        </h2>

        <p id="stageMessageText"></p>

      </div>

    </div>

  </div>

</div>


<!-- RESULT -->

<div id="result" class="result">

  <div class="resultInner">

    <div class="resultTitle">
      🏆 全ステージ制覇！
    </div>

    <div class="resultPanel">

      <div class="crown">
        👑 伝説の美装職人
      </div>

      <div id="finalScore" class="finalScore">
        0点
      </div>

      <div id="bestText" class="bestText">
        🏆 ハイスコア：0点
      </div>

      <div class="challenge">

        <h3>
          ⚔️ 友達のスコアに挑戦
        </h3>

        <input
          id="friendScore"
          type="number"
          inputmode="numeric"
          placeholder="友達のスコアを入力"
        >

        <button id="judgeBtn">
          勝負判定！
        </button>

        <div id="judgeResult" class="judge"></div>

      </div>

      <div class="resultButtons">

        <button id="restartBtn" class="restart">
          もう一度！
        </button>

        <button id="shareBtn" class="share">
          𝕏 挑戦状をシェア
        </button>

      </div>

    </div>

    <div class="footer">
      美装職人！クリーンマスター
    </div>

  </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let stage = 1;
let time = 30;
let score = 0;
let combo = 0;
let remaining = 0;

let playing = false;
let timer = null;
let dirtTimer = null;

const TOTAL_STAGES = 4;
const STAGE_TIME = 30;

const game = document.getElementById("game");

const stageHUD = document.getElementById("stageHUD");
const timeHUD = document.getElementById("timeHUD");
const scoreHUD = document.getElementById("scoreHUD");
const comboHUD = document.getElementById("comboHUD");

const startCard = document.getElementById("startCard");
const startBtn = document.getElementById("startBtn");

const stageMessage = document.getElementById("stageMessage");
const stageMessageTitle = document.getElementById("stageMessageTitle");
const stageMessageText = document.getElementById("stageMessageText");

const result = document.getElementById("result");
const finalScore = document.getElementById("finalScore");
const bestText = document.getElementById("bestText");

const friendScore = document.getElementById("friendScore");
const judgeBtn = document.getElementById("judgeBtn");
const judgeResult = document.getElementById("judgeResult");

const restartBtn = document.getElementById("restartBtn");
const shareBtn = document.getElementById("shareBtn");


/* =========================
   HIGH SCORE
========================= */

function getHighScore(){

  const value =
    Number(localStorage.getItem("bisoHighScore")) || 0;

  return value;
}

function saveHighScore(value){

  localStorage.setItem(
    "bisoHighScore",
    String(value)
  );
}


/* =========================
   HUD
========================= */

function updateHUD(){

  stageHUD.textContent = stage;

  timeHUD.textContent = time;

  scoreHUD.textContent =
    score.toLocaleString();

  comboHUD.textContent =
    combo + "🔥";
}


/* =========================
   SCENE
========================= */

function showStage(){

  document
    .querySelectorAll(".scene")
    .forEach(scene => {
      scene.classList.remove("active");
    });

  const current =
    document.getElementById("scene" + stage);

  if(current){
    current.classList.add("active");
  }
}


/* =========================
   CREATE DIRT
========================= */

function createDirt(){

  if(!playing) return;

  const dirt =
    document.createElement("div");

  dirt.className = "dirt";

  if(Math.random() < 0.3){
    dirt.classList.add("small");
  }

  const x =
    7 + Math.random() * 82;

  const y =
    18 + Math.random() * 62;

  dirt.style.left = x + "%";
  dirt.style.top = y + "%";

  dirt.addEventListener(
    "pointerdown",
    cleanDirt,
    {passive:false}
  );

  game.appendChild(dirt);

  remaining++;

  /* automatically remove very old dirt */

  setTimeout(() => {

    if(
      dirt &&
      dirt.parentNode &&
      !dirt.classList.contains("gone")
    ){

      dirt.remove();

      remaining =
        Math.max(0, remaining - 1);

    }

  }, 5000);
}


/* =========================
   CLEAN DIRT
========================= */

function cleanDirt(e){

  e.preventDefault();

  if(!playing) return;

  const dirt =
    e.currentTarget;

  if(dirt.classList.contains("gone")){
    return;
  }

  dirt.classList.add("gone");

  setTimeout(() => {
    if(dirt.parentNode){
      dirt.remove();
    }
  },150);

  remaining =
    Math.max(0, remaining - 1);

  combo++;

  /*
    基本点
    コンボが続くほど増える
  */

  const base =
    100 + combo * 20;

  score += base;

  updateHUD();

}


/* =========================
   START GAME
========================= */

function startGame(){

  clearInterval(timer);
  clearInterval(dirtTimer);

  playing = true;

  stage = 1;
  time = STAGE_TIME;
  score = 0;
  combo = 0;
  remaining = 0;

  result.classList.remove("show");
  startCard.style.display = "none";
  stageMessage.classList.remove("show");

  clearDirt();

  showStage();
  updateHUD();

  createDirt();

  dirtTimer =
    setInterval(() => {

      /*
        常に複数の汚れを出す
      */

      if(remaining < 10){
        createDirt();
      }

    },650);

  timer =
    setInterval(() => {

      if(!playing) return;

      time--;

      updateHUD();

      if(time <= 0){

        clearInterval(timer);

        endStage();

      }

    },1000);
}


/* =========================
   END STAGE
========================= */

function endStage(){

  if(!playing) return;

  clearInterval(timer);

  if(stage < TOTAL_STAGES){

    stageMessageTitle.textContent =
      "🔥 STAGE CLEAR!";

    stageMessageText.textContent =
      "次の現場へ！";

    stageMessage.classList.add("show");

    setTimeout(() => {

      stageMessage.classList.remove("show");

      stage++;

      time = STAGE_TIME;

      combo = 0;

      clearDirt();

      showStage();
      updateHUD();

      startStageTimer();

    },1200);

  }else{

    finishGame();

  }
}


/* =========================
   START NEXT STAGE
========================= */

function startStageTimer(){

  if(!playing) return;

  createDirt();

  clearInterval(timer);

  timer =
    setInterval(() => {

      if(!playing) return;

      time--;

      updateHUD();

      if(time <= 0){

        clearInterval(timer);

        endStage();

      }

    },1000);
}


/* =========================
   CLEAR DIRT
========================= */

function clearDirt(){

  document
    .querySelectorAll(".dirt")
    .forEach(d => d.remove());

  remaining = 0;
}


/* =========================
   FINISH GAME
========================= */

function finishGame(){

  playing = false;

  clearInterval(timer);
  clearInterval(dirtTimer);

  clearDirt();

  const old =
    getHighScore();

  const isNewBest =
    score > old;

  /*
    ★重要
    今回のスコアをそのまま保存。
    11910点などに固定しない。
  */

  if(isNewBest){

    saveHighScore(score);

  }

  const high =
    Math.max(
      score,
      getHighScore()
    );

  finalScore.textContent =
    score.toLocaleString() + "点";

  if(isNewBest){

    bestText.innerHTML =
      "🔥 自己ベスト更新！<br>" +
      "🏆 ハイスコア：" +
      high.toLocaleString() +
      "点";

  }else{

    bestText.innerHTML =
      "🏆 ハイスコア：" +
      high.toLocaleString() +
      "点<br>" +
      "友達にも挑戦してもらおう！";

  }

  judgeResult.textContent = "";

  friendScore.value = "";

  result.classList.add("show");

}


/* =========================
   FRIEND JUDGE
========================= */

function judgeFriend(){

  const friend =
    Number(friendScore.value);

  if(!Number.isFinite(friend) || friend < 0){

    judgeResult.textContent =
      "友達のスコアを入力してな！";

    return;

  }

  if(score > friend){

    judgeResult.textContent =
      "🔥 俺の勝ち！";

  }else if(score < friend){

    judgeResult.textContent =
      "😱 友達の勝ち！";

  }else{

    judgeResult.textContent =
      "🤝 引き分け！";

  }

}


/* =========================
   RESTART
========================= */

function restartGame(){

  result.classList.remove("show");

  startGame();

}


/* =========================
   SHARE
========================= */

function shareChallenge(){

  const text =
`🧹 美装職人！クリーンマスター

👑 俺のスコア：${score.toLocaleString()}点

🔥 このスコア超えられる？
👉 俺より高得点出してみて！

#美装 #掃除 #ゲーム`;

  const url =
    location.href;

  const shareUrl =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text) +
    "&url=" +
    encodeURIComponent(url);

  window.open(
    shareUrl,
    "_blank"
  );
}


/* =========================
   BUTTON EVENTS
========================= */

startBtn.addEventListener(
  "click",
  startGame
);

judgeBtn.addEventListener(
  "click",
  judgeFriend
);

restartBtn.addEventListener(
  "click",
  restartGame
);

shareBtn.addEventListener(
  "click",
  shareChallenge
);


/* =========================
   INITIALIZE
========================= */

updateHUD();

</script>

</body>
</html>
