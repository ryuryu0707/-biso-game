<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>美装職人！クリーンマスター</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
margin:0;
padding:0;
min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
background:#071222;
color:white;
overflow-x:hidden;
}

body{padding:15px 12px 30px}

h1{
text-align:center;
font-size:clamp(24px,7vw,40px);
margin:5px 0;
font-weight:900;
}

.sub{
text-align:center;
font-size:clamp(14px,4vw,21px);
font-weight:800;
color:#dbe5f5;
margin-bottom:15px;
}

.hud{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
max-width:900px;
margin:auto;
}

.box{
background:#162d4e;
border-radius:18px;
padding:12px 4px;
text-align:center;
}

.num{
font-size:clamp(23px,7vw,38px);
font-weight:900;
line-height:1;
}

.label{
font-size:13px;
margin-top:6px;
color:#dbe5f5;
}

.game{
position:relative;
height:min(720px,68vh);
min-height:500px;
max-width:900px;
margin:16px auto;
border:6px solid #3e6085;
border-radius:40px;
overflow:hidden;
touch-action:manipulation;
}

/* ステージ背景 */

.kitchen{
background:
linear-gradient(135deg,#fff1c8 0 48%,#d8b27a 48%);
}

.bath{
background:
linear-gradient(135deg,#e7faff,#83c7db);
}

.aircon{
background:
linear-gradient(180deg,#dff4ff 0 55%,#b4cfe2 55%);
}

.room{
background:
linear-gradient(135deg,#d9cbbb 0 50%,#8d7660 50%);
}

.pro{
background:
linear-gradient(135deg,#eef3f8 0 50%,#aebdce 50%);
}

.stageName{
position:absolute;
top:18px;
left:22px;
font-size:clamp(20px,5vw,34px);
font-weight:900;
opacity:.3;
pointer-events:none;
}

.dirt{
position:absolute;
border:0;
z-index:5;
cursor:pointer;
filter:drop-shadow(0 6px 6px #0005);
}

.small{
width:55px;
height:38px;
border-radius:50%;
background:#684020;
}

.medium{
width:75px;
height:50px;
border-radius:50%;
background:#70421f;
}

.hard{
width:82px;
height:55px;
border-radius:50%;
background:#55291d;
outline:5px solid #ff7045;
}

.gold{
width:75px;
height:52px;
border-radius:50%;
background:#ffd34e;
outline:4px solid #fff1a0;
}

.dirt:after{
content:"";
position:absolute;
left:20%;
top:20%;
width:55%;
height:40%;
border-radius:50%;
background:#98704f;
opacity:.7;
}

.hard:after{background:#80382b}
.gold:after{background:#fff19b}

.float{
position:absolute;
z-index:20;
font-size:28px;
font-weight:900;
pointer-events:none;
animation:up .7s forwards;
}

@keyframes up{
0%{opacity:1;transform:translateY(0)}
100%{opacity:0;transform:translateY(-60px)}
}

#result{
display:none;
max-width:750px;
margin:30px auto;
padding:30px 20px;
background:#19345a;
border:5px solid #3e6085;
border-radius:35px;
text-align:center;
}

#result h2{
font-size:38px;
margin:10px 0;
}

.final{
font-size:60px;
font-weight:900;
color:#ffc247;
}

button{
border:0;
border-radius:18px;
padding:16px 35px;
font-size:20px;
font-weight:900;
background:#4fe09d;
color:#062318;
margin-top:20px;
}

.flash{
position:absolute;
inset:0;
z-index:30;
background:#ff333355;
animation:flash .25s forwards;
pointer-events:none;
}

@keyframes flash{
to{background:transparent}
}
</style>
</head>

<body>

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">

<div class="box">
<div class="num" id="stage">1</div>
<div class="label">ステージ</div>
</div>

<div class="box">
<div class="num" id="time">30</div>
<div class="label">残り時間</div>
</div>

<div class="box">
<div class="num" id="score">0</div>
<div class="label">スコア</div>
</div>

<div class="box">
<div class="num" id="combo">0</div>
<div class="label">コンボ</div>
</div>

</div>

<div id="game" class="game kitchen">

<div id="stageName" class="stageName">
🔍 KITCHEN
</div>

</div>

<div id="result">

<div style="font-size:60px">🏆</div>

<h2>ゲーム終了！</h2>

<div>あなたのスコア</div>

<div id="finalScore" class="final">
0点
</div>

<button onclick="location.reload()">
もう一度！
</button>

</div>

<script>

const stages=[
{
name:"🔍 KITCHEN",
className:"kitchen",
time:30,
dirt:7
},
{
name:"🛁 BATH",
className:"bath",
time:30,
dirt:9
},
{
name:"❄️ AIR CONDITIONER",
className:"aircon",
time:30,
dirt:11
},
{
name:"🛋️ ROOM",
className:"room",
time:30,
dirt:13
},
{
name:"✨ PROFESSIONAL",
className:"pro",
time:35,
dirt:16
}
];

let stage=0;
let score=0;
let combo=0;
let time=30;
let playing=true;
let timer;

const game=document.getElementById("game");
const stageEl=document.getElementById("stage");
const timeEl=document.getElementById("time");
const scoreEl=document.getElementById("score");
const comboEl=document.getElementById("combo");
const stageName=document.getElementById("stageName");

function hud(){

stageEl.textContent=stage+1;
timeEl.textContent=time;
scoreEl.textContent=Math.max(0,score).toLocaleString();
comboEl.textContent=combo;

}

function clearDirt(){

document.querySelectorAll(".dirt").forEach(d=>d.remove());

}

function makeDirt(){

if(!playing)return;

const s=stages[stage];

if(document.querySelectorAll(".dirt").length>=s.dirt)return;

const d=document.createElement("button");

const r=Math.random();

let points;

if(r<0.1){
d.className="dirt gold";
points=1500;
}
else if(r<0.3){
d.className="dirt hard";
points=350;
}
else if(r<0.65){
d.className="dirt medium";
points=200;
}
else{
d.className="dirt small";
points=100;
}

d.dataset.points=points;

d.style.left=(5+Math.random()*85)+"%";
d.style.top=(8+Math.random()*84)+"%";

d.onclick=function(e){

e.stopPropagation();

if(!playing)return;

const p=Number(d.dataset.points);

d.remove();

combo++;

const bonus=1+Math.min(combo-1,20)*0.05;

const add=Math.round(p*bonus);

score+=add;

floatText("+"+add);

hud();

if(document.querySelectorAll(".dirt").length===0){

setTimeout(nextStage,300);

}

};

game.appendChild(d);

}

function floatText(text){

const f=document.createElement("div");

f.className="float";

f.textContent=text;

f.style.left="45%";
f.style.top="45%";

game.appendChild(f);

setTimeout(()=>f.remove(),700);

}

function wrong(){

if(!playing)return;

score-=100;

if(score<0)score=0;

combo=0;

floatText("−100");

const f=document.createElement("div");

f.className="flash";

game.appendChild(f);

setTimeout(()=>f.remove(),250);

hud();

}

game.onclick=function(e){

if(e.target===game ||
e.target===stageName){

wrong();

}

};

function startStage(){

const s=stages[stage];

clearDirt();

game.className="game "+s.className;

stageName.textContent=s.name;

time=s.time;

combo=0;

hud();

for(let i=0;i<Math.min(6,s.dirt);i++){

makeDirt();

}

clearInterval(timer);

timer=setInterval(function(){

if(!playing)return;

time--;

hud();

if(time<=0){

nextStage();

}

},1000);

}

function nextStage(){

if(!playing)return;

if(stage>=stages.length-1){

endGame();

return;

}

stage++;

startStage();

}

function endGame(){

playing=false;

clearInterval(timer);

clearDirt();

document.getElementById("finalScore").textContent=
score.toLocaleString()+"点";

document.getElementById("result").style.display="block";

}

setInterval(function(){

if(!playing)return;

if(document.querySelectorAll(".dirt").length<stages[stage].dirt){

makeDirt();

}

},700);

/* 開いた瞬間にゲーム開始 */

startStage();

</script>

</body>
</html>
