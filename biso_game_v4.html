<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>美装職人！クリーンマスター</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
margin:0;
min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
background:#071222;
color:white
}

body{padding:10px;overflow-x:hidden}

h1{
text-align:center;
font-size:clamp(24px,7vw,42px);
margin:8px 0 2px;
font-weight:900
}

.sub{
text-align:center;
color:#dbe7f5;
font-weight:800;
margin-bottom:14px
}

.hud{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
max-width:900px;
margin:auto
}

.box{
background:#162a46;
border-radius:16px;
text-align:center;
padding:10px 4px
}

.num{
font-size:clamp(22px,6vw,34px);
font-weight:900
}

.lab{
font-size:12px;
color:#c8d6e8;
font-weight:800
}

/* ゲーム */

.game{
position:relative;
max-width:900px;
height:min(72vh,760px);
min-height:500px;
margin:18px auto 12px;
border:5px solid #416486;
border-radius:28px;
overflow:hidden;
touch-action:none
}

.room{
position:absolute;
inset:0;
transition:background .4s
}

/* ステージ背景 */

.kitchen{
background:
linear-gradient(135deg,#fff0c7 0 48%,#d9bd89 48%)
}

.bath{
background:
linear-gradient(135deg,#d9f6ff,#86c9e7)
}

.window{
background:
linear-gradient(135deg,#bfe7ff 0 55%,#75a9ce 55%)
}

.living{
background:
linear-gradient(135deg,#ead8c0,#a98361)
}

.office{
background:
linear-gradient(135deg,#d9d7d0,#8d949b)
}

.roomTitle{
position:absolute;
top:12px;
left:18px;
color:#ffffffaa;
font-size:25px;
font-weight:900;
z-index:2
}

/* 汚れ */

.dirt{
position:absolute;
width:62px;
height:42px;
border-radius:50%;
background:#704122;
box-shadow:0 7px 12px #0005;
cursor:pointer;
z-index:3;
transform:translate(-50%,-50%)
}

.dirt:after{
content:"";
position:absolute;
inset:10px 16px;
border-radius:50%;
background:#916a4f
}

.dirt.good{
background:#b78b00;
box-shadow:
0 0 0 4px #ffd34d66,
0 7px 12px #0005
}

.dirt.good:after{
background:#ffe16a
}

.dirt:active{
transform:translate(-50%,-50%) scale(.85)
}

/* 得点表示 */

.spark{
position:absolute;
pointer-events:none;
font-size:25px;
font-weight:900;
z-index:5;
animation:pop .55s forwards
}

@keyframes pop{
0%{
opacity:1;
transform:translate(-50%,-50%) scale(.8)
}
100%{
opacity:0;
transform:translate(-50%,-120px) scale(1.2)
}
}

/* 結果画面 */

.overlay{
position:absolute;
inset:0;
background:#061120e8;
display:none;
align-items:center;
justify-content:center;
padding:18px;
z-index:20
}

.panel{
width:min(92%,620px);
background:#193455;
border:5px solid #4b78a3;
border-radius:28px;
padding:25px 18px;
text-align:center
}

.panel h2{
font-size:34px;
margin:0 0 8px
}

.finalScore{
font-size:clamp(55px,15vw,100px);
font-weight:900;
color:#ffc83d;
line-height:1.05
}

/* ランキング */

.rank{
background:#0b1c33;
border-radius:20px;
padding:15px;
margin-top:18px;
text-align:left
}

.rank h3{
text-align:center;
margin:2px 0 10px;
font-size:23px
}

.rankrow{
display:flex;
justify-content:space-between;
padding:10px 4px;
border-bottom:1px solid #ffffff22;
font-weight:800
}

.rankrow:last-child{
border-bottom:0
}

input{
width:100%;
font-size:18px;
padding:13px;
border:0;
border-radius:14px;
margin:12px 0
}

button{
border:0;
border-radius:16px;
padding:15px 22px;
font-size:19px;
font-weight:900;
background:#4fdda0;
color:#052017
}

.hint{
text-align:center;
color:#9fb5cf;
font-size:13px;
margin:8px
}

@media(max-width:600px){

body{padding:6px}

.game{
height:70vh;
min-height:500px
}

.dirt{
width:57px;
height:39px
}

.roomTitle{
font-size:21px
}

.panel{
padding:22px 14px
}

}
</style>
</head>

<body>

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">

<div class="box">
<div class="num" id="stage">1</div>
<div class="lab">ステージ</div>
</div>

<div class="box">
<div class="num" id="time">45</div>
<div class="lab">残り時間</div>
</div>

<div class="box">
<div class="num" id="score">0</div>
<div class="lab">スコア</div>
</div>

<div class="box">
<div class="num" id="combo">0</div>
<div class="lab">コンボ</div>
</div>

</div>


<div class="game" id="game">

<div class="room kitchen" id="room">

<div class="roomTitle" id="roomTitle">
🍳 KITCHEN
</div>

</div>


<div class="overlay" id="overlay">

<div class="panel">

<div style="font-size:55px">
🏆
</div>

<h2 id="endTitle">
ゲーム終了！
</h2>

<div>
あなたのスコア
</div>

<div class="finalScore" id="finalScore">
0
</div>


<div class="rank">

<h3>
🏆 あなたのランキング
</h3>

<div id="ranking">
</div>

</div>


<input
id="name"
maxlength="12"
placeholder="名前を入力（例：リュウタ）"
>


<button id="saveBtn">
ランキングに登録
</button>


<button
id="againBtn"
style="margin-left:5px;background:#55b9ff"
>
もう一度！
</button>

</div>

</div>

</div>


<div class="hint">
汚れをタップ！間違えたら−500点。汚れを全部消しても時間までは同じステージ！
</div>


<script>

"use strict";


/* =========================
ステージ設定
========================= */

const STAGES=[

{
name:"🍳 KITCHEN",
className:"kitchen",
time:45,
count:18
},

{
name:"🛁 BATHROOM",
className:"bath",
time:42,
count:22
},

{
name:"🪟 WINDOW",
className:"window",
time:40,
count:26
},

{
name:"🛋️ LIVING ROOM",
className:"living",
time:38,
count:30
},

{
name:"💻 OFFICE",
className:"office",
time:36,
count:34
}

];


/* =========================
変数
========================= */

let stage=0;

let score=0;

let combo=0;

let remaining=0;

let dirty=0;

let playing=false;

let timer=null;


/* =========================
HTML
========================= */

const game=
document.getElementById("game");

const room=
document.getElementById("room");

const roomTitle=
document.getElementById("roomTitle");

const overlay=
document.getElementById("overlay");


/* =========================
表示
========================= */

function updateHUD(){

document.getElementById("stage")
.textContent=stage+1;

document.getElementById("time")
.textContent=Math.ceil(remaining);

document.getElementById("score")
.textContent=
Math.max(0,score)
.toLocaleString();

document.getElementById("combo")
.textContent=combo;

}


/* =========================
汚れを消す
========================= */

function clearDirt(){

room
.querySelectorAll(".dirt,.spark")
.forEach(function(el){

el.remove();

});

}


/* =========================
汚れ配置
========================= */

function spawnDirt(){

clearDirt();

dirty=
STAGES[stage].count;


/*
大量配置
*/

for(
let i=0;
i<dirty;
i++
){

const dirt=
document.createElement("div");


/*
約20%は高得点汚れ
*/

if(
Math.random()<0.2
){

dirt.className=
"dirt good";

dirt.dataset.point=
"1500";

}else{

dirt.className=
"dirt";

dirt.dataset.point=
"1000";

}


/*
ランダム位置
*/

dirt.style.left=
(7+Math.random()*86)+"%";

dirt.style.top=
(9+Math.random()*82)+"%";


/*
タップ
*/

dirt.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

e.stopPropagation();

if(!playing)return;

if(dirt.dataset.hit)return;

dirt.dataset.hit="1";


/*
コンボ
*/

combo++;


/*
加点
*/

let point=
Number(dirt.dataset.point);

point+=
Math.min(
combo*100,
1500
);

score+=point;

dirty--;


/*
表示
*/

showPopup(
e.clientX,
e.clientY,
"+"+point,
true
);


/*
削除
*/

dirt.remove();


updateHUD();


/*
全部消した場合
同じステージで
新しい汚れを追加
*/

if(dirty<=0){

setTimeout(
function(){

if(
playing &&
remaining>0
){

spawnDirt();

}

},
250
);

}

});


room.appendChild(dirt);

}

}


/* =========================
ポップアップ
========================= */

function showPopup(
x,
y,
text,
good
){

const rect=
game.getBoundingClientRect();


const el=
document.createElement("div");


el.className="spark";


el.textContent=text;


el.style.left=
(x-rect.left)+"px";


el.style.top=
(y-rect.top)+"px";


el.style.color=
good
?"#42f5a0"
:"#ff6464";


game.appendChild(el);


setTimeout(
function(){

el.remove();

},
550
);

}


/* =========================
空振り
========================= */

game.addEventListener(
"pointerdown",
function(e){

if(!playing)return;


/*
汚れを押した場合は
無視
*/

if(
e.target.classList.contains("dirt")
){

return;

}


/*
減点
*/

score-=500;


/*
0未満禁止
*/

if(score<0){

score=0;

}


/*
コンボリセット
*/

combo=0;


showPopup(
e.clientX,
e.clientY,
"-500",
false
);


updateHUD();

});


/* =========================
ステージ開始
========================= */

function startStage(){

const config=
STAGES[stage];


playing=true;


remaining=
config.time;


combo=0;


/*
背景変更
*/

room.className=
"room "+config.className;


roomTitle.textContent=
config.name;


/*
汚れ
*/

spawnDirt();


updateHUD();


/*
タイマー
*/

clearInterval(timer);


timer=
setInterval(
function(){

if(!playing)return;


remaining-=0.1;


if(remaining<=0){

remaining=0;

updateHUD();

nextStage();

}else{

updateHUD();

}

},
100
);

}


/* =========================
次ステージ
========================= */

function nextStage(){

if(!playing)return;


playing=false;

clearInterval(timer);


if(
stage<STAGES.length-1
){

stage++;

startStage();

}else{

endGame();

}

}


/* =========================
ゲーム終了
========================= */

function endGame(){

playing=false;

clearInterval(timer);


document.getElementById(
"finalScore"
).textContent=
score.toLocaleString()+"点";


document.getElementById(
"endTitle"
).textContent=
"🎉 全ステージ終了！";


renderRanking();


overlay.style.display=
"flex";

}


/* =========================
ランキング取得
========================= */

function getRanking(){

try{

return JSON.parse(
localStorage.getItem(
"cleanMasterRanking"
)||"[]"
);

}catch(e){

return[];

}

}


/* =========================
HTMLエスケープ
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
ランキング表示
========================= */

function renderRanking(){

const list=
getRanking();


const box=
document.getElementById("ranking");


if(list.length===0){

box.innerHTML=
'<div style="text-align:center;color:#9fb5cf">まだランキングがありません</div>';

return;

}


box.innerHTML=
list
.slice(0,10)
.map(
function(item,index){

return `
<div class="rankrow">

<span>
${index+1}位 ${escapeHTML(item.name)}
</span>

<span>
${Number(item.score).toLocaleString()}点
</span>

</div>
`;

}
)
.join("");

}


/* =========================
ランキング登録
========================= */

document
.getElementById("saveBtn")
.addEventListener(
"click",
function(){

const input=
document.getElementById("name");


const name=
(
input.value.trim()
||
"リュウタ"
).slice(0,12);


const list=
getRanking();


list.push({

name:name,

score:score

});


list.sort(
function(a,b){

return b.score-a.score;

});


localStorage.setItem(
"cleanMasterRanking",
JSON.stringify(
list.slice(0,10)
)
);


renderRanking();


this.textContent=
"登録しました！";

});


/* =========================
もう一度
========================= */

document
.getElementById("againBtn")
.addEventListener(
"click",
function(){

overlay.style.display=
"none";


stage=0;

score=0;

combo=0;

remaining=0;

dirty=0;


startStage();

});


/* =========================
ゲーム起動
========================= */

window.addEventListener(
"load",
function(){

startStage();

});

</script>

</body>
</html>
