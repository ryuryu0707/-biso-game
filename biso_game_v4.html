<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>美装職人！クリーンマスター</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#071222;
  color:white;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

#app{
  min-height:100vh;
  padding:12px;
}

h1{
  text-align:center;
  margin:8px 0 2px;
  font-size:25px;
}

.sub{
  text-align:center;
  color:#c9d7e9;
  font-weight:700;
  margin-bottom:12px;
}

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}

.box{
  background:#162b49;
  border-radius:16px;
  padding:10px 4px;
  text-align:center;
}

.num{
  font-size:23px;
  font-weight:900;
}

.label{
  font-size:12px;
  color:#c9d7e9;
}

#game{
  position:relative;
  width:100%;
  height:65vh;
  min-height:430px;
  border:4px solid #42658b;
  border-radius:24px;
  overflow:hidden;
  transition:background .5s;
}

/* ステージ背景 */
.stage1{
  background:
    linear-gradient(135deg,#f3e2c5,#c9a97b);
}

.stage2{
  background:
    linear-gradient(135deg,#dff4ff,#8bb8d4);
}

.stage3{
  background:
    linear-gradient(135deg,#e8f2f8,#9db7c8);
}

.stage4{
  background:
    linear-gradient(135deg,#eee8dc,#b99e7b);
}

.stage5{
  background:
    linear-gradient(135deg,#d8d8d8,#777);
}

/* 開始画面 */
#startScreen,
#resultScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#071222;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.panel{
  width:100%;
  max-width:500px;
  background:#162b49;
  border-radius:24px;
  padding:28px 20px;
  text-align:center;
  border:3px solid #42658b;
}

.panel h2{
  font-size:30px;
  margin:5px 0 10px;
}

.panel p{
  color:#d4e0ee;
  line-height:1.7;
}

.mainBtn{
  border:0;
  background:#4fda9c;
  color:#052017;
  font-weight:900;
  font-size:20px;
  padding:16px 35px;
  border-radius:18px;
  margin-top:15px;
}

.hidden{
  display:none!important;
}

/* 汚れ */
.dirt{
  position:absolute;
  width:58px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;
  z-index:5;
  box-shadow:0 5px 12px #0005;
}

.dirt::after{
  content:"";
  position:absolute;
  inset:8px 15px;
  border-radius:50%;
  background:#ffffff22;
}

.dirt.gold{
  background:#6b4228;
}

.dirt.rare{
  background:#68451e;
  border:3px solid #ff7043;
}

.dirt.hard{
  background:#466577;
  border:3px solid #9bdfff;
  box-shadow:0 0 18px #66ccff88;
}

.float{
  position:absolute;
  z-index:20;
  font-size:25px;
  font-weight:900;
  animation:float .7s forwards;
  pointer-events:none;
}

@keyframes float{
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-55px)}
}

#stageMessage{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  font-size:40px;
  font-weight:900;
  text-shadow:0 4px 10px #000;
  opacity:0;
}

#stageMessage.show{
  animation:stage .9s;
}

@keyframes stage{
  0%{opacity:0;transform:scale(.7)}
  30%{opacity:1;transform:scale(1)}
  80%{opacity:1}
  100%{opacity:0}
}

.resultScore{
  font-size:64px;
  font-weight:900;
  color:#ffc34d;
}

.rank{
  margin-top:18px;
  background:#0b1c33;
  border-radius:18px;
  padding:15px;
}

.rankRow{
  display:flex;
  justify-content:space-between;
  padding:10px 4px;
  border-bottom:1px solid #29425f;
}

.rankRow:last-child{
  border-bottom:0;
}
</style>
</head>

<body>

<div id="startScreen">
  <div class="panel">
    <div style="font-size:55px">🧹</div>
    <h2>美装職人！<br>クリーンマスター</h2>
    <p>
      🐉 龍＆🐶わんこと競争！<br>
      誰でも遊べる掃除ゲーム🔥
    </p>
    <p>
      汚れを見つけてタップ！<br>
      間違えると<strong>−100点</strong>！
    </p>
    <button class="mainBtn" onclick="startGame()">ゲーム開始！</button>
  </div>
</div>

<div id="resultScreen" class="hidden">
  <div class="panel">
    <div style="font-size:45px">🏆</div>
    <h2>ゲーム終了！</h2>
    <div>あなたのスコア</div>
    <div id="finalScore" class="resultScore">0点</div>

    <div class="rank">
      <h3>🏆 あなたのランキング</h3>
      <div class="rankRow">
        <span>🥇 リュウタ</span>
        <strong id="rankScore">0点</strong>
      </div>
      <div class="rankRow">
        <span>🥈 テスト</span>
        <strong>100点</strong>
      </div>
    </div>

    <button class="mainBtn" onclick="startGame()">もう一度！</button>
  </div>
</div>

<div id="app">

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="sub">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム🔥
</div>

<div class="hud">
  <div class="box">
    <div class="num" id="stage">1</div>
    <div class="label">ステージ</div>
  </div>

  <div class="box">
    <div class="num" id="time">30</div>
    <div class="label">残り時間</div>
  </div>

  <div class="box">
    <div class="num" id="score">0</div>
    <div class="label">スコア</div>
  </div>

  <div class="box">
    <div class="num" id="combo">0</div>
    <div class="label">コンボ</div>
  </div>
</div>

<div id="game" class="stage1" onclick="wrongTap(event)">
  <div id="stageMessage"></div>
</div>

</div>

<script>

let stage=1;
let score=0;
let combo=0;
let time=30;
let timer=null;
let playing=false;

const STAGE_TIME=30;
const MAX_STAGE=5;

const pointTable={
  gold:1500,
  rare:700,
  hard:350
};

const backgrounds=[
  "stage1",
  "stage2",
  "stage3",
  "stage4",
  "stage5"
];

function startGame(){

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");

  stage=1;
  score=0;
  combo=0;

  startStage();
}

function startStage(){

  clearInterval(timer);

  playing=true;
  time=STAGE_TIME;
  combo=0;

  updateHUD();
  clearGame();

  const game=document.getElementById("game");

  game.className=backgrounds[stage-1];

  showStageMessage("STAGE "+stage);

  createDirt(5+stage*2);

  timer=setInterval(()=>{
    if(!playing)return;

    time--;
    updateHUD();

    if(time<=0){
      nextStage();
    }

  },1000);
}

function createDirt(count){

  for(let i=0;i<count;i++){

    const dirt=document.createElement("div");

    const types=["gold","gold","rare","hard"];
    const type=types[Math.floor(Math.random()*types.length)];

    dirt.className="dirt "+type;
    dirt.dataset.type=type;

    dirt.style.left=(5+Math.random()*82)+"%";
    dirt.style.top=(5+Math.random()*85)+"%";

    dirt.addEventListener("click",cleanDirt);

    document.getElementById("game").appendChild(dirt);
  }
}

function cleanDirt(e){

  e.stopPropagation();

  if(!playing)return;

  const dirt=e.currentTarget;

  if(dirt.dataset.cleaned)return;

  dirt.dataset.cleaned="1";

  const type=dirt.dataset.type;

  let points=pointTable[type] || 100;

  combo++;

  const bonus=combo>=5 ? 100 : 0;

  points+=bonus;

  score+=points;

  showFloat(dirt,"+"+points);

  dirt.remove();

  updateHUD();

  if(document.querySelectorAll(".dirt").length===0){
    setTimeout(nextStage,400);
  }
}

function wrongTap(e){

  if(!playing)return;

  if(e.target.classList.contains("dirt"))return;

  score-=100;

  combo=0;

  showFloatAt(e.clientX,e.clientY,"−100");

  updateHUD();
}

function showFloat(dirt,text){

  const r=dirt.getBoundingClientRect();

  showFloatAt(
    r.left+r.width/2,
    r.top,
    text
  );
}

function showFloatAt(x,y,text){

  const el=document.createElement("div");

  el.className="float";
  el.textContent=text;

  el.style.left=(x-30)+"px";
  el.style.top=(y-30)+"px";

  document.body.appendChild(el);

  setTimeout(()=>el.remove(),700);
}

function nextStage(){

  if(!playing)return;

  clearInterval(timer);

  if(stage>=MAX_STAGE){

    finishGame();
    return;
  }

  stage++;

  startStage();
}

function finishGame(){

  playing=false;

  clearInterval(timer);

  clearGame();

  document.getElementById("finalScore").textContent=
    score.toLocaleString()+"点";

  document.getElementById("rankScore").textContent=
    score.toLocaleString()+"点";

  document.getElementById("resultScreen").classList.remove("hidden");
}

function clearGame(){

  document
    .querySelectorAll(".dirt")
    .forEach(d=>d.remove());
}

function updateHUD(){

  document.getElementById("stage").textContent=stage;
  document.getElementById("time").textContent=Math.max(0,time);
  document.getElementById("score").textContent=
    score.toLocaleString();
  document.getElementById("combo").textContent=combo;
}

function showStageMessage(text){

  const el=document.getElementById("stageMessage");

  el.textContent=text;

  el.classList.remove("show");

  void el.offsetWidth;

  el.classList.add("show");
}

</script>

</body>
</html>
