<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>美装職人！クリーンマスター</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
 background:#071222;
 color:#fff;
}

body{
 padding:12px;
}

h1{
 text-align:center;
 margin:4px 0;
 font-size:clamp(24px,7vw,40px);
 font-weight:900;
}

.subtitle{
 text-align:center;
 color:#dbe5f5;
 font-weight:800;
 margin-bottom:12px;
}

.hud{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 max-width:900px;
 margin:auto;
}

.hudBox{
 background:#162d4e;
 border-radius:16px;
 padding:9px 3px;
 text-align:center;
}

.hudNumber{
 font-size:clamp(22px,7vw,36px);
 font-weight:900;
}

.hudLabel{
 font-size:11px;
 color:#cbd9ea;
}

#game{
 position:relative;
 max-width:900px;
 height:68vh;
 min-height:500px;
 margin:14px auto;
 border:5px solid #3e6287;
 border-radius:30px;
 overflow:hidden;
 touch-action:none;
}

/* =========================
   ステージ背景
========================= */

.stage1{
 background:
 linear-gradient(#f8e8c8 0 58%,#b87943 58% 100%);
}

.stage1:before{
 content:"KITCHEN";
 position:absolute;
 top:30px;
 left:30px;
 font-size:34px;
 font-weight:900;
 color:#704622;
 opacity:.25;
}

.stage1:after{
 content:"🍳";
 position:absolute;
 right:12%;
 bottom:14%;
 font-size:100px;
 opacity:.3;
}

.stage2{
 background:
 linear-gradient(#d9f7ff 0 55%,#82c6d8 55% 100%);
}

.stage2:before{
 content:"BATHROOM";
 position:absolute;
 top:30px;
 left:30px;
 font-size:32px;
 font-weight:900;
 color:#236b7c;
 opacity:.25;
}

.stage2:after{
 content:"🛁";
 position:absolute;
 right:10%;
 bottom:12%;
 font-size:100px;
 opacity:.3;
}

.stage3{
 background:
 linear-gradient(#a9d9f2 0 65%,#b78b5f 65% 100%);
}

.stage3:before{
 content:"WINDOW";
 position:absolute;
 top:30px;
 left:30px;
 font-size:32px;
 font-weight:900;
 color:#245d7a;
 opacity:.25;
}

.stage3:after{
 content:"🪟";
 position:absolute;
 right:10%;
 bottom:12%;
 font-size:100px;
 opacity:.3;
}

.stage4{
 background:
 linear-gradient(#ded0bd 0 65%,#936443 65% 100%);
}

.stage4:before{
 content:"ROOM";
 position:absolute;
 top:30px;
 left:30px;
 font-size:34px;
 font-weight:900;
 color:#604431;
 opacity:.25;
}

.stage4:after{
 content:"🛋️";
 position:absolute;
 right:9%;
 bottom:12%;
 font-size:100px;
 opacity:.3;
}

.stage5{
 background:
 linear-gradient(#d9f2f5 0 55%,#8abcc4 55% 100%);
}

.stage5:before{
 content:"PRO CLEAN";
 position:absolute;
 top:30px;
 left:30px;
 font-size:32px;
 font-weight:900;
 color:#286b72;
 opacity:.25;
}

.stage5:after{
 content:"✨";
 position:absolute;
 right:12%;
 bottom:13%;
 font-size:110px;
 opacity:.35;
}

/* =========================
   汚れ
========================= */

.dirt{
 position:absolute;
 z-index:10;
 border:0;
 padding:0;
 cursor:pointer;
 box-shadow:0 5px 10px #0007;
}

.dirt:active{
 transform:scale(.85);
}

.oil{
 width:72px;
 height:46px;
 border-radius:50%;
 background:#4a3522;
}

.burn{
 width:70px;
 height:50px;
 border-radius:50%;
 background:#401b15;
 outline:4px solid #e95d3b;
}

.dust{
 width:48px;
 height:34px;
 border-radius:50%;
 background:#77736d;
}

.mold{
 width:58px;
 height:58px;
 border-radius:50%;
 background:#356a3b;
}

.water{
 width:65px;
 height:42px;
 border-radius:50%;
 background:#568b9b;
 outline:3px solid #a7e5f4;
}

.stain{
 width:78px;
 height:50px;
 border-radius:50%;
 background:#62452d;
}

.gold{
 width:68px;
 height:48px;
 border-radius:50%;
 background:#e1b92f;
 outline:4px solid #fff09b;
}

/* =========================
   得点表示
========================= */

.float{
 position:absolute;
 z-index:30;
 font-size:27px;
 font-weight:900;
 pointer-events:none;
 animation:floatUp .7s forwards;
}

.plus{
 color:#6cffae;
}

.minus{
 color:#ff6868;
}

@keyframes floatUp{
 0%{
  opacity:1;
  transform:translateY(0) scale(1);
 }
 100%{
  opacity:0;
  transform:translateY(-65px) scale(1.2);
 }
}

/* =========================
   ステージ表示
========================= */

#stageBanner{
 position:absolute;
 inset:0;
 z-index:50;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#071222dd;
}

.bannerBox{
 background:#173252;
 border:3px solid #4b739c;
 border-radius:25px;
 padding:25px;
 text-align:center;
 width:85%;
 max-width:420px;
}

.bannerBox h2{
 margin:0 0 8px;
 font-size:32px;
}

.bannerBox p{
 color:#dbe5f5;
 font-weight:800;
}

.startButton{
 border:0;
 background:#4fe09d;
 color:#062318;
 border-radius:16px;
 padding:15px 30px;
 font-size:20px;
 font-weight:900;
}

.hidden{
 display:none!important;
}

/* =========================
   結果
========================= */

#result{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#071222f5;
 justify-content:center;
 align-items:center;
 padding:20px;
}

.resultBox{
 width:100%;
 max-width:500px;
 background:#173252;
 border:4px solid #4b739c;
 border-radius:28px;
 padding:28px;
 text-align:center;
}

.resultBox h2{
 font-size:34px;
}

.finalScore{
 font-size:60px;
 font-weight:900;
 color:#ffd04d;
}

.retry{
 border:0;
 background:#4fe09d;
 color:#062318;
 border-radius:16px;
 padding:15px 30px;
 font-size:20px;
 font-weight:900;
 margin-top:15px;
}

@media(max-width:600px){

 #game{
  min-height:500px;
  height:68vh;
 }

 .dirt.oil,
 .dirt.burn,
 .dirt.stain{
  transform:scale(.85);
 }

}
</style>
</head>

<body>

<h1>🧹 美装職人！クリーンマスター</h1>

<div class="subtitle">
🐉 龍＆🐶わんこと競争！誰でも遊べる掃除ゲーム 🔥
</div>

<div class="hud">

<div class="hudBox">
<div id="stageNumber" class="hudNumber">1</div>
<div class="hudLabel">ステージ</div>
</div>

<div class="hudBox">
<div id="timeNumber" class="hudNumber">30</div>
<div class="hudLabel">残り時間</div>
</div>

<div class="hudBox">
<div id="scoreNumber" class="hudNumber">0</div>
<div class="hudLabel">スコア</div>
</div>

<div class="hudBox">
<div id="comboNumber" class="hudNumber">0</div>
<div class="hudLabel">コンボ</div>
</div>

</div>


<div id="game" class="stage1">

<div id="stageBanner">

<div class="bannerBox">

<h2 id="bannerTitle">
STAGE 1
</h2>

<p id="bannerText">
キッチン掃除
</p>

<p>
汚れを見つけてタップ！<br>
間違えると−100点！
</p>

<button id="startButton" class="startButton">
スタート！
</button>

</div>

</div>

</div>


<div id="result">

<div class="resultBox">

<div style="font-size:60px">
🏆
</div>

<h2>
ゲーム終了！
</h2>

<div>
あなたのスコア
</div>

<div id="finalScore" class="finalScore">
0点
</div>

<button id="retry" class="retry">
もう一度！
</button>

</div>

</div>


<script>

/* =====================================
   ステージ設定
===================================== */

const stages = [

{
name:"キッチン掃除",
className:"stage1",
time:30,
count:7,
dirt:["oil","burn","dust"]
},

{
name:"お風呂掃除",
className:"stage2",
time:30,
count:9,
dirt:["mold","water","stain"]
},

{
name:"窓・サッシ掃除",
className:"stage3",
time:30,
count:11,
dirt:["dust","stain","water"]
},

{
name:"部屋掃除",
className:"stage4",
time:30,
count:13,
dirt:["dust","stain","oil","burn"]
},

{
name:"プロ美装",
className:"stage5",
time:35,
count:16,
dirt:["burn","mold","water","gold"]
}

];


/* =====================================
   ゲーム変数
===================================== */

let currentStage=0;

let score=0;

let combo=0;

let time=30;

let playing=false;

let timer=null;


/* =====================================
   HTML
===================================== */

const game=document.getElementById("game");

const banner=document.getElementById("stageBanner");

const bannerTitle=document.getElementById("bannerTitle");

const bannerText=document.getElementById("bannerText");

const startButton=document.getElementById("startButton");

const stageNumber=document.getElementById("stageNumber");

const timeNumber=document.getElementById("timeNumber");

const scoreNumber=document.getElementById("scoreNumber");

const comboNumber=document.getElementById("comboNumber");

const result=document.getElementById("result");

const finalScore=document.getElementById("finalScore");

const retry=document.getElementById("retry");


/* =====================================
   HUD更新
===================================== */

function updateHUD(){

stageNumber.textContent=currentStage+1;

timeNumber.textContent=time;

scoreNumber.textContent=
Math.max(0,score).toLocaleString();

comboNumber.textContent=combo;

}


/* =====================================
   汚れを消す
===================================== */

function clearDirt(){

game
.querySelectorAll(".dirt")
.forEach(function(d){
d.remove();
});

}


/* =====================================
   汚れ作成
===================================== */

function createDirt(){

const stage=stages[currentStage];

const dirt=document.createElement("button");

dirt.type="button";

const type=
stage.dirt[
Math.floor(
Math.random()*stage.dirt.length
)
];

dirt.className="dirt "+type;


/* ランダム配置 */

dirt.style.left=
(6+Math.random()*82)+"%";

dirt.style.top=
(8+Math.random()*82)+"%";


/* 得点 */

let point=100;

if(type==="oil"){
point=150;
}

if(type==="dust"){
point=100;
}

if(type==="water"){
point=200;
}

if(type==="mold"){
point=250;
}

if(type==="stain"){
point=300;
}

if(type==="burn"){
point=400;
}

if(type==="gold"){
point=1000;
}


dirt.dataset.point=point;


/* 正解タップ */

dirt.addEventListener(
"pointerdown",
function(e){

e.stopPropagation();

if(!playing)return;


/* コンボ */

combo++;


/* コンボボーナス */

const bonus=
Math.min(combo,10)*20;


/* 加点 */

const add=
point+bonus;

score+=add;


/* 表示 */

showFloat(
"＋"+add,
dirt.offsetLeft,
dirt.offsetTop,
true
);


/* 消去 */

dirt.remove();


/* HUD */

updateHUD();


/*
全部消しても
ステージ変更しない
*/

}
);


game.appendChild(dirt);

}


/* =====================================
   ステージ開始
===================================== */

function startStage(){

const stage=stages[currentStage];


/* 背景変更 */

game.className=
stage.className;


/* 汚れ削除 */

clearDirt();


/* 時間 */

time=stage.time;


/* コンボ */

combo=0;


/* HUD */

updateHUD();


/* 汚れを配置 */

for(
let i=0;
i<stage.count;
i++
){

createDirt();

}


/* プレイ開始 */

playing=true;


/* タイマー */

clearInterval(timer);

timer=setInterval(
function(){

if(!playing)return;

time--;

updateHUD();


/*
時間が0になったら
次ステージ
*/

if(time<=0){

clearInterval(timer);

nextStage();

}

},
1000
);

}


/* =====================================
   間違いタップ
===================================== */

game.addEventListener(
"pointerdown",
function(e){

if(!playing)return;


/*
汚れをタップした場合は
ここでは減点しない
*/

if(
e.target.classList.contains("dirt")
){

return;

}


/*
間違い
*/

score-=100;


/*
コンボリセット
*/

combo=0;


/*
スコアがマイナスにはならない
*/

if(score<0){
score=0;
}


/*
表示
*/

showFloat(
"−100",
e.offsetX,
e.offsetY,
false
);


/* HUD */

updateHUD();

}
);


/* =====================================
   得点表示
===================================== */

function showFloat(
text,
x,
y,
good
){

const f=
document.createElement("div");

f.className=
"float "+(
good ? "plus":"minus"
);

f.textContent=text;

f.style.left=x+"px";

f.style.top=y+"px";

game.appendChild(f);

setTimeout(
function(){
f.remove();
},
700
);

}


/* =====================================
   次ステージ
===================================== */

function nextStage(){

playing=false;


/*
まだステージがある
*/

if(
currentStage<
stages.length-1
){

currentStage++;

showStageBanner();

return;

}


/*
5ステージ終了
*/

finishGame();

}


/* =====================================
   ステージバナー
===================================== */

function showStageBanner(){

const stage=
stages[currentStage];

bannerTitle.textContent=
"STAGE "+(currentStage+1);

bannerText.textContent=
stage.name;

banner.classList.remove("hidden");

}


/* =====================================
   ゲーム終了
===================================== */

function finishGame(){

playing=false;

clearInterval(timer);

clearDirt();

finalScore.textContent=
score.toLocaleString()+"点";

result.style.display="flex";

}


/* =====================================
   最初のスタート
===================================== */

startButton.addEventListener(
"click",
function(){

banner.classList.add("hidden");

startStage();

}
);


/* =====================================
   リトライ
===================================== */

retry.addEventListener(
"click",
function(){

currentStage=0;

score=0;

combo=0;

time=30;

result.style.display="none";

showStageBanner();

updateHUD();

}
);


/* =====================================
   初期表示
===================================== */

updateHUD();

showStageBanner();

</script>

</body>
</html>
