<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美装職人！クリーンマスター Ver.3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1523;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}
.wrap{max-width:720px;margin:auto;padding:12px;min-height:100vh}
h1{text-align:center;font-size:24px;margin:4px 0}
.sub{text-align:center;color:#b9c5d8;font-weight:700;margin:4px 0 10px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#1a2639;padding:9px;border-radius:15px}
.card{text-align:center}.num{font-size:21px;font-weight:900}.label{font-size:10px;color:#aeb9ca}
#combo{color:#ffb84d}
#game{position:relative;height:min(72vh,600px);min-height:450px;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px #0008}
.scene{position:absolute;inset:0}
.kitchen{background:linear-gradient(#dcecff 0 42%,#9a6d49 42%);display:block}
.bath{background:linear-gradient(#cdefff 0 50%,#d7d0c4 50%);display:none}
.aircon{background:linear-gradient(#e8f3ff 0 55%,#d2d5d9 55%);display:none}
.room{background:linear-gradient(#f0e0cc 0 58%,#8b654c 58%);display:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:43%;background:#9a6d49;border-top:8px solid #d7b187}
.counter{position:absolute;left:0;right:0;bottom:0;height:58%;background:#8a5e40;border-top:8px solid #d8b188}
.cab{position:absolute;left:8%;bottom:8%;width:84%;height:43%;border:7px solid #5c3b2a;background:#a87952;border-radius:10px}
.sink{position:absolute;left:35%;bottom:34%;width:30%;height:13%;background:#b9c9d5;border:5px solid #778995;border-radius:0 0 28px 28px}
.bathTub{position:absolute;left:14%;bottom:20%;width:72%;height:28%;background:#eef5f7;border:8px solid #8194a0;border-radius:30px 30px 12px 12px}
.shower{position:absolute;right:15%;top:15%;width:18%;height:40%;border-right:8px solid #71808b;border-top:8px solid #71808b;border-radius:0 30px 0 0}
.ac{position:absolute;left:18%;top:18%;width:64%;height:18%;background:#f7f9fb;border:7px solid #98a7b2;border-radius:12px;box-shadow:inset 0 -12px #dce4ea}
.sofa{position:absolute;left:12%;bottom:12%;width:55%;height:28%;background:#70523f;border-radius:18px 18px 8px 8px;border:7px solid #543b2e}
.floor2{position:absolute;inset:auto 0 0;height:42%;background:#8a654e}
.dirt{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:5px solid #3e2a20;box-shadow:0 0 0 7px #ffffff20;z-index:5;font-size:27px;user-select:none;transition:.12s transform}
.dirt:active{transform:scale(.78)}
.oil{background:#533820}.dust{background:#8d9297}.mold{background:#4c713e}.scale{background:#d8dde2}.hair{background:#4e4038}.water{background:#8fd5ef}
#message{position:absolute;z-index:20;left:50%;top:10%;transform:translateX(-50%);font-size:24px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;white-space:nowrap}
.pop{animation:pop .55s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}30%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-20px) scale(1.1)}}
#start{position:absolute;inset:0;z-index:30;background:#0b1322e8;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:#17243a;border:1px solid #ffffff22;border-radius:20px;padding:22px;text-align:center;width:100%;max-width:450px}
.panel h2{margin:0 0 8px;font-size:27px}.characters{font-size:42px;margin:6px}
.rank{font-size:27px;font-weight:900;margin:8px}
button{border:0;border-radius:14px;padding:13px 20px;margin:5px;font-weight:900;font-size:16px;background:#5ee1a3;color:#082116}
button.secondary{background:#35455e;color:#fff}
.best{color:#ffd166;font-weight:900}
.footer{text-align:center;color:#8493a8;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>🧹 美装職人！クリーンマスター</h1>
<div class="sub">🐉龍＆🐶わんこと現場を攻略！ステージ制Ver.3🔥</div>

<div class="hud">
<div class="card"><div class="num" id="stage">1</div><div class="label">ステージ</div></div>
<div class="card"><div class="num" id="time">30</div><div class="label">残り秒数</div></div>
<div class="card"><div class="num" id="score">0</div><div class="label">スコア</div></div>
<div class="card"><div class="num" id="combo">0</div><div class="label">コンボ🔥</div></div>
</div>

<div id="game">
<div class="scene kitchen" id="kitchen"><div class="counter"></div><div class="cab"></div><div class="sink"></div></div>
<div class="scene bath" id="bath"><div class="bathTub"></div><div class="shower"></div></div>
<div class="scene aircon" id="aircon"><div class="ac"></div></div>
<div class="scene room" id="room"><div class="floor2"></div><div class="sofa"></div></div>
<div id="message"></div>

<div id="start">
<div class="panel" id="panel">
<div class="characters">🐉　🐶</div>
<h2>美装職人！Ver.3</h2>
<p>4ステージを順番に攻略！<br>汚れを全部落として次の現場へ🔥</p>
<p class="best">🏆 ハイスコア：<span id="best">0</span>点</p>
<button onclick="startGame()">現場へ出発！</button>
</div>
</div>
</div>
<div class="footer">美装職人！クリーンマスター Ver.3</div>
</div>

<script>
const $=id=>document.getElementById(id);
let stage=1,time=30,score=0,combo=0,left=0,timer=null,playing=false;
let best=Number(localStorage.getItem("bisoBestV3")||0);
$("best").textContent=best;

const stages=[
 {name:"🍳 キッチン",id:"kitchen",count:12},
 {name:"🚿 お風呂",id:"bath",count:14},
 {name:"❄️ エアコン",id:"aircon",count:16},
 {name:"🏠 超汚部屋",id:"room",count:18}
];
const types=[
 ["oil","🛢️",20],["dust","💨",15],["mold","🦠",30],
 ["scale","💧",25],["hair","🧹",22],["water","💦",18]
];

function showStage(){
 document.querySelectorAll(".scene").forEach(x=>x.style.display="none");
 $(stages[stage-1].id).style.display="block";
 $("stage").textContent=stage;
}
function spawn(){
 const t=types[Math.floor(Math.random()*types.length)];
 const d=document.createElement("div");
 d.className="dirt "+t[0]; d.textContent=t[1]; d.dataset.pts=t[2];
 d.style.left=(7+Math.random()*82)+"%";
 d.style.top=(13+Math.random()*72)+"%";
 d.addEventListener("pointerdown",clean,{once:true});
 $("game").appendChild(d);
}
function clean(e){
 if(!playing)return;
 const d=e.currentTarget, pts=Number(d.dataset.pts);
 combo++;
 const bonus=combo>=10?40:combo>=5?20:combo>=3?10:0;
 const total=pts+bonus;
 score+=total; left--; d.remove();
 $("score").textContent=score; $("combo").textContent=combo;
 $("message").textContent=(combo>=3?"🔥 "+combo+"コンボ！ ":"✨ ピカッ！ ")+"+"+total;
 $("message").classList.remove("pop"); void $("message").offsetWidth; $("message").classList.add("pop");
 if(left<=0) nextStage();
}
function startGame(){
 stage=1;score=0;time=30;combo=0;playing=true;
 $("score").textContent=0;$("combo").textContent=0;$("time").textContent=30;
 $("start").style.display="none"; showStage(); beginStage();
}
function beginStage(){
 document.querySelectorAll(".dirt").forEach(x=>x.remove());
 left=stages[stage-1].count;
 for(let i=0;i<left;i++)spawn();
 clearInterval(timer);
 timer=setInterval(()=>{
  time--; $("time").textContent=time;
  if(time<=0)finish(false);
 },1000);
}
function nextStage(){
 if(stage>=stages.length){finish(true);return}
 stage++; combo=0; $("combo").textContent=0;
 $("message").textContent="🎉 "+stages[stage-1].name+"へ！";
 $("message").classList.remove("pop");void $("message").offsetWidth;$("message").classList.add("pop");
 beginStage();
}
function rank(s){
 if(s>=1500)return["👑","伝説の美装職人"];
 if(s>=1100)return["🏆","極・美装職人"];
 if(s>=750)return["🥇","熟練美装職人"];
 if(s>=450)return["🥈","一人前美装職人"];
 return["🥉","見習い美装職人"];
}
function finish(clear){
 playing=false;clearInterval(timer);
 document.querySelectorAll(".dirt").forEach(x=>x.remove());
 if(clear)score+=time*20;
 if(score>best){best=score;localStorage.setItem("bisoBestV3",best)}
 const r=rank(score);
 $("start").style.display="flex";
 $("panel").innerHTML=`
 <div class="characters">🐉　🐶</div>
 <h2>${clear?"🎉 全ステージ制覇！":"⏰ タイムアップ！"}</h2>
 <div class="rank">${r[0]} ${r[1]}</div>
 <p>スコア：<b>${score}点</b></p>
 <p>${clear?"👑 4現場コンプリート！":"💪 次はもっと上を狙おう！"}</p>
 <p class="best">🏆 ハイスコア：${best}点</p>
 <button onclick="startGame()">もう一度！</button>
 <button class="secondary" onclick="shareScore()">Xでシェア</button>`;
}
async function shareScore(){
 const r=rank(score);
 const text=`🧹 美装職人！クリーンマスター\n\n${r[0]} ${r[1]}\nスコア：${score}点\n\n4ステージ制覇に挑戦🔥\n#美装 #掃除 #ゲーム`;
 if(navigator.share){try{await navigator.share({title:"美装職人！クリーンマスター",text})}catch(e){}}
 else{try{await navigator.clipboard.writeText(text);alert("シェア文をコピーしたで！")}catch(e){alert(text)}}
}
showStage();
</script>
</body>
</html>
